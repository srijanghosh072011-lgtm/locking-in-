<style>

               radial-gradient(700px 420px at 105% 108%, color-mix(in srgb, var(--c1) 18%, transparent), transparent 60%); }

    background:repeating-linear-gradient(115deg, #fff 0 1px, transparent 1px 46px); }

  button { font:inherit; cursor:pointer; border:0; border-radius:4px; padding:8px 14px; background:#1d2534; color:var(--txt); font-weight:600; transition:all .35s var(--bez); }
  button:hover { filter:brightness(1.3); transform:translateY(-1px); }
  button:active { transform:scale(.97); }
  button.primary { background:linear-gradient(100deg, var(--volt), #9ed400); color:#0a0e00;
    font-family:'Barlow Condensed'; text-transform:uppercase; font-weight:800; font-size:17px; letter-spacing:1.5px; padding:10px 26px;
    clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); border-radius:0; box-shadow:0 6px 24px -6px #d6ff3f55; }
  input, select { font:inherit; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:9px 10px; }
  input:focus, select:focus { outline:2px solid var(--volt); outline-offset:-1px; }
  .screen { display:none; max-width:1140px; margin:0 auto; padding:16px; }
  .screen.on { display:block; }
  /* double-bezel panels */
  .card { background:#ffffff08; border:1px solid var(--line); border-radius:18px; padding:7px; margin:14px 0;
    animation:rise .6s var(--bez) both; }
  .card > .in, .card.flat { background:linear-gradient(180deg,var(--panel),var(--panel2)); border-radius:12px; padding:16px;
    box-shadow:inset 0 1px 1px #ffffff10; }
  .card.flat { border-radius:12px; margin:0; animation:none; }
  #tabbody > .card:nth-child(2) { animation-delay:.08s } #tabbody > .card:nth-child(3) { animation-delay:.16s }
  @keyframes rise { from { opacity:0; transform:translateY(22px); filter:blur(5px); } to { opacity:1; transform:none; filter:none; } }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--mut); font-size:13px; }
  .eyebrow { display:inline-block; border:1px solid var(--line); background:#ffffff08; border-radius:999px; padding:3px 12px; font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--mut); }
  table.grid { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.grid th, table.grid td { padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); }
  table.grid th { color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:13px; letter-spacing:1.5px; font-weight:600; }
  table.grid tr.click { transition:all .3s var(--bez); }
  table.grid tr.click:hover { background:#ffffff0a; cursor:pointer; box-shadow:inset 3px 0 0 var(--volt); }
  table.grid tr.me { background:color-mix(in srgb, var(--c1) 16%, transparent); box-shadow:inset 3px 0 0 var(--c1); }
  .face { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#161d2b; vertical-align:middle; }
  .logo { object-fit:contain; vertical-align:middle; filter:drop-shadow(0 2px 6px #0009); }
  .ovr { display:inline-block; min-width:32px; text-align:center; font-family:'Barlow Condensed'; font-weight:800; font-size:16px; padding:2px 5px; color:#141414;
    clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); }
  .t-gold { background:linear-gradient(160deg,#f5d87c,#c9a33c); } .t-silver { background:linear-gradient(160deg,#d8dee8,#98a1b0); } .t-bronze { background:linear-gradient(160deg,#d0a06c,#96683c); }
  /* header */
  header#top { display:flex; align-items:center; gap:14px; padding:10px 20px; margin:10px auto 0; max-width:1140px;
    background:#0f141dd9; backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px;
    position:sticky; top:10px; z-index:5; flex-wrap:wrap; box-shadow:0 12px 40px -18px #000; }
  header#top .grow { flex:1; }
  #h-club { font-family:'Barlow Condensed'; font-size:23px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  nav { display:flex; gap:0; margin:16px 0 4px; flex-wrap:wrap; }
  nav button { background:none; border-radius:0; color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:17px; letter-spacing:1.5px; padding:10px 18px; position:relative; }
  nav button:hover { color:#fff; transform:none; }
  nav button.act { color:#fff; }
  nav button.act::after { content:''; position:absolute; left:14px; right:14px; bottom:2px; height:3px; background:var(--volt); transform:skewX(-20deg); }
  /* hero */
  .hero { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line); margin:14px 0 4px; padding:22px 26px;
    background:linear-gradient(105deg, color-mix(in srgb, var(--c1) 42%, #0a0e16) 0%, var(--panel2) 55%, #0a0e16 100%); animation:rise .6s var(--bez) both; }
  .hero::before { content:''; position:absolute; inset:0; opacity:.12; background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 26px); }
  .hero .heroface { position:absolute; right:14px; bottom:-12px; width:170px; height:170px; object-fit:contain; opacity:.95;
    filter:drop-shadow(0 8px 24px #000c); -webkit-mask-image:linear-gradient(#000 78%, transparent); mask-image:linear-gradient(#000 78%, transparent); }
  .hero .big { font-family:'Anton'; font-size:clamp(24px,4vw,40px); text-transform:uppercase; line-height:1.02; }
  .clubcard { background:#ffffff08; border:1px solid var(--line); border-radius:16px; padding:6px; cursor:pointer; width:212px; transition:all .4s var(--bez); animation:rise .5s var(--bez) both; }

  .clubcard .in { background:linear-gradient(165deg,var(--panel),var(--panel2)); border-radius:11px; padding:16px; text-align:center; }
  .clubcard:hover { transform:translateY(-4px) scale(1.02); border-color:var(--volt); box-shadow:0 18px 40px -18px #000; }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  #modal-bg { display:none; position:fixed; inset:0; background:#000000d5; backdrop-filter:blur(10px); z-index:10; align-items:center; justify-content:center; }
  #modal-bg.on { display:flex; }
  #modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; max-width:620px; width:94%; max-height:88vh; overflow:auto; animation:rise .45s var(--bez) both; }

  .fut { width:240px; margin:0 auto; padding:20px 14px 14px; text-align:center; color:#1c1508; position:relative; overflow:hidden;
    clip-path:polygon(0 6%,50% 0,100% 6%,100% 94%,50% 100%,0 94%); }
  .fut::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,#ffffff3d 42%,transparent 55%); pointer-events:none; }
  .fut.t-gold { background:linear-gradient(165deg,#f8e7a9 0%,#e9c95c 45%,#b8912e 100%); }

  .fut.t-bronze { background:linear-gradient(165deg,#e8c39a 0%,#c99a64 45%,#8a5f33 100%); }

  .fut .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 8px; font-size:14px; padding:5px 12px 0; font-weight:600; }
  .fut .stats b { font-size:17px; }

  .pitch::before { content:''; position:absolute; left:50%; top:-9%; width:34%; aspect-ratio:1; border:2px solid #ffffff3a; border-radius:50%; transform:translateX(-50%); }
  .pitch::after { content:''; position:absolute; left:25%; bottom:0; width:50%; height:14%; border:2px solid #ffffff3a; border-bottom:0; }

</div>

  const nat = Math.random() < 0.6 && NAMES[country] ? country : pick(Object.keys(NAMES));
  const n = NAMES[nat] || NAMES.England;
  const pos = pick(['DF', 'DF', 'MF', 'MF', 'AT', 'AT', 'GK']);
  const age = 16 + R(3);
  const base = 52 + rnd(0, 14);
  const p = { id: nextId++, name: pick(n.f) + ' ' + pick(n.l), nat, pos, age, img: null, fit: 100, injury: 0, apps: 0, sg: 0, sa: 0, listed: false, youth: true };
  p.a = SHAPE[pos].map(s => Math.round(clamp(base + s + rnd(-5, 5), 25, 90)));
  p.ovr = Math.round(p.a.reduce((s, v, i) => s + v * W[pos][i], 0));
  p.pot = clamp(p.ovr + 8 + R(20), p.ovr, 95);
  p.value = calcValue(p);
  p.wage = Math.max(500, Math.round(p.value / 2500 / 100) * 100);
  p.years = 3;
  return p;
}

// ---------- fixtures & dates ----------
function roundRobin(ids) {
  const t = ids.slice(), n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const rd = [];
    for (let i = 0; i < n / 2; i++) rd.push(r % 2 ? [t[n - 1 - i], t[i]] : [t[i], t[n - 1 - i]]);
    rounds.push(rd);
    t.splice(1, 0, t.pop());
  }
  return rounds;
}
function nthWeekday(y, m, wd, n) { // n>=1; m 0-11
  const d = new Date(Date.UTC(y, m, 1));
  let day = 1 + (7 + wd - d.getUTCDay()) % 7 + (n - 1) * 7;
  return Date.UTC(y, m, day);
}
function leagueDates(n, s0) { // Saturdays, spilling onto Mondays for 40+ round leagues
  const sats = Array.from({ length: 39 }, (_, k) => s0 + k * 7 * DAY);
  if (n <= 39) return sats.slice(0, n);
  const mons = [];
  for (let i = 1; i <= n - 39; i++) mons.push(s0 + Math.floor(i * 39 / (n - 38)) * 7 * DAY + 2 * DAY);
  return sats.concat(mons).sort((a, b) => a - b).slice(0, n);
}
const seasonMonth = (Y, m) => m >= 6 ? Y : Y + 1; // season Aug Y – May Y+1

const CUP_NAMES = { England: 'FA Cup', Spain: 'Copa del Rey', Germany: 'DFB-Pokal', Italy: 'Coppa Italia', France: 'Coupe de France', Portugal: 'Taça de Portugal' };
const STAGE = n => ({ 32: 'Round of 32', 16: 'Round of 16', 8: 'Quarter-final', 4: 'Semi-final', 2: 'FINAL' })[n] || 'Round';

const power = c => { // squad strength = avg of best 18 OVRs
  const t = c.players.map(p => p.ovr).sort((a, b) => b - a).slice(0, 18);
  return t.reduce((s, v) => s + v, 0) / Math.max(1, t.length);
};
const leagueClubs = (G, li) => G.clubs.filter(c => c.lg === li);

// ---------- season generation ----------
function genSeason(G) {
  const Y = G.year;
  G.fixtures = []; G.knock = {}; G.groups = {};
  const s0 = nthWeekday(Y, 7, 6, 3); // 3rd Saturday of Aug
  // leagues (MLS 30 clubs: single round-robin, everyone else double)
  DB.leagues.forEach((L, li) => {
    const ids = leagueClubs(G, li).map(c => c.id);
    let rounds = roundRobin(shuffle(ids));
    if (ids.length < 26) rounds = rounds.concat(rounds.map(rd => rd.map(([h, a]) => [a, h]))); // MLS (30 clubs) plays single round-robin
    const dates = leagueDates(rounds.length, s0);
    rounds.forEach((rd, r) => rd.forEach(([h, a]) =>
      G.fixtures.push({ c: 'L' + li, r: r + 1, t: dates[r], h, a, hg: 0, ag: 0, pl: false })));
  });
  // domestic cups: 32 entrants (all D1 + best of D2), Wednesdays
  const cupWeds = [[8, 2], [9, 2], [10, 2], [2, 2], [4, 3]].map(([m, n]) => nthWeekday(seasonMonth(Y, m), m, 3, n));
  G.cupCountries = DB.leagues.map((L, li) => L.play && L.level === 1 ? li : -1).filter(li => li >= 0);
  for (const li of G.cupCountries) {
    const L = DB.leagues[li];
    let entrants = leagueClubs(G, li);
    if (L.d2 != null) entrants = entrants.concat(leagueClubs(G, L.d2).sort((a, b) => power(b) - power(a)).slice(0, 32 - entrants.length));
    const size = entrants.length >= 32 ? 32 : 16;
    entrants = entrants.sort((a, b) => power(b) - power(a)).slice(0, size);
    G.knock['C' + li] = { name: CUP_NAMES[L.country], flag: L.flag, alive: entrants.map(c => c.id), dates: cupWeds.slice(5 - Math.log2(size)), round: 0 };
    drawRound(G, 'C' + li);
  }
  // Europe: UCL + UEL groups (Tue / Thu), knockout later
  const slots = { 'Premier League': 4, 'La Liga': 4, 'Bundesliga': 4, 'Serie A': 4, 'Ligue 1': 3, 'Primeira Liga': 2, 'Süper Lig': 2 };
  const ranked = li => (G.lastTables && G.lastTables[li] || leagueClubs(G, li).sort((a, b) => power(b) - power(a)).map(c => c.id))
    .filter(id => DB.leagues[G.clubs[id].lg].level === 1); // relegated clubs don't play in Europe
  let ucl = [], uel = [];
  for (const [li, L] of DB.leagues.entries()) {
    if (!L.uefa) continue;
    const ids = ranked(li), n = slots[L.name] || 2;
    ucl.push(...ids.slice(0, n));
    uel.push(...ids.slice(n, n + 3));
  }
  const rest = DB.leagues.flatMap((L, li) => L.uefa ? ranked(li) : []).filter(id => !ucl.includes(id) && !uel.includes(id))
    .sort((a, b) => power(G.clubs[b]) - power(G.clubs[a]));
  while (ucl.length < 32) ucl.push(uel.length ? uel.shift() : rest.shift());
  while (uel.length < 32) uel.push(rest.shift());
  const groupDays = wd => [[8, 3], [9, 1], [9, 4], [10, 2], [11, 1], [11, 2]].map(([m, n]) => nthWeekday(seasonMonth(Y, m), m, wd, n));
  const koDays = wd => [[1, 3], [3, 2], [3, 4]].map(([m, n]) => nthWeekday(seasonMonth(Y, m), m, wd, n));
  for (const [comp, teams, wd] of [['UCL', ucl, 2], ['UEL', uel, 4]]) {
    const pots = [0, 1, 2, 3].map(i => shuffle(teams.slice().sort((a, b) => power(G.clubs[b]) - power(G.clubs[a])).slice(i * 8, i * 8 + 8)));
    G.groups[comp] = Array.from({ length: 8 }, (_, g) => pots.map(pot => pot[g]));
    const dates = groupDays(wd);
    G.groups[comp].forEach((grp, gi) => {
      const rr = roundRobin(grp);
      rr.concat(rr.map(rd => rd.map(([h, a]) => [a, h]))).forEach((rd, r) =>
        rd.forEach(([h, a]) => G.fixtures.push({ c: comp + 'g', g: gi, r: r + 1, t: dates[r], h, a, hg: 0, ag: 0, pl: false })));
    });
    G.knock[comp] = { name: comp === 'UCL' ? 'Champions League' : 'Europa League', flag: '⭐', alive: null, // seeded after groups
      dates: koDays(wd).concat(nthWeekday(Y + 1, 4, 6, 4) + (comp === 'UEL' ? -2 * DAY : 0)), round: 0 };
  }
  G.seasonOver = false;
}

function drawRound(G, comp) {
  const K = G.knock[comp];
  const t = K.dates[K.round];
  const order = shuffle(K.alive);
  for (let i = 0; i < order.length; i += 2)
    G.fixtures.push({ c: comp, r: K.round + 1, stage: STAGE(order.length), t, h: order[i], a: order[i + 1], hg: 0, ag: 0, pl: false });
}

// knockout ties can't end level: penalties, slightly biased to the stronger side
function settleTie(G, f) {
  if (f.hg !== f.ag) return f.hg > f.ag ? f.h : f.a;
  f.pen = Math.random() < 0.5 + (power(G.clubs[f.h]) - power(G.clubs[f.a])) * 0.02 ? f.h : f.a;
  return f.pen;
}

const EURO_PRIZE = { UCL: [10e6, 12e6, 15e6, 25e6], UEL: [4e6, 5e6, 6e6, 10e6] };
function progressComps(G) {
  // group stages done → seed knockouts
  for (const comp of ['UCL', 'UEL']) {
    const K = G.knock[comp];
    if (!K.alive && G.fixtures.filter(f => f.c === comp + 'g').every(f => f.pl)) {
      K.alive = G.groups[comp].flatMap((grp, gi) => table(G, comp + 'g', grp, gi).slice(0, 2).map(r => r.id));
      drawRound(G, comp);
      news(G, `⭐ ${K.name} group stage complete — knockout rounds drawn.`);
    }
  }
  // knockout rounds done → next round or champion
  for (const [comp, K] of Object.entries(G.knock)) {
    if (!K.alive || K.alive.length < 2) continue;
    const cur = G.fixtures.filter(f => f.c === comp && f.r === K.round + 1);
    if (!cur.length || !cur.every(f => f.pl)) continue;
    K.alive = cur.map(f => settleTie(G, f));
    K.round++;
    const prize = EURO_PRIZE[comp];
    if (prize) for (const id of K.alive) G.clubs[id].budget += prize[Math.min(K.round - 1, 3)];
    if (K.alive.length === 1) {
      const winner = G.clubs[K.alive[0]];
      winner.budget += prize ? prize[3] : 5e6;
      winner.morale = clamp(winner.morale + 10, 30, 99);
      news(G, `🏆 ${winner.n} win the ${K.name}!`);
      if (winner.id === G.userClub) {
        G.trophies.push(`${K.name} — ${G.year}/${(G.year + 1) % 100}`);
        G.rep = clamp(G.rep + (comp === 'UCL' ? 15 : comp === 'UEL' ? 8 : 5), 0, 100);
      }
    } else drawRound(G, comp);
  }
}

// ---------- selection & match sim ----------
const FORMATIONS = { '4-4-2': [4, 4, 2], '4-3-3': [4, 3, 3], '3-5-2': [3, 5, 2], '4-5-1': [4, 5, 1], '5-3-2': [5, 3, 2] };
function bestXI(c) {
  const [d, m, a] = FORMATIONS[c.formation] || [4, 3, 3];
  const need = { GK: 1, DF: d, MF: m, AT: a };
  const fit = c.players.filter(p => !p.injury).sort((x, y) => y.ovr * y.fit - x.ovr * x.fit);
  const xi = [];
  for (const pos of ['GK', 'DF', 'MF', 'AT'])
    xi.push(...fit.filter(p => p.pos === pos && !xi.includes(p)).slice(0, need[pos]));
  for (const p of fit.concat(c.players)) { if (xi.length >= 11) break; if (!xi.includes(p)) xi.push(p); }
  return xi;
}
function strength(c, xi, home) {
  const avgOvr = xi.reduce((s, p) => s + p.ovr, 0) / xi.length;
  const avgFit = xi.reduce((s, p) => s + p.fit, 0) / xi.length;
  const ment = c.mentality === 'attacking' ? 2 : c.mentality === 'defensive' ? -2 : 0;
  return avgOvr + (c.morale - 70) / 10 + (avgFit - 85) / 10 + (home ? 2.5 : 0) + ment;
}
function simMatch(G, hc, ac, detailed) {
  const hXI = bestXI(hc), aXI = bestXI(ac);
  const hs = strength(hc, hXI, true), as = strength(ac, aXI, false);
  let hg = 0, ag = 0;
  const ev = [], scorers = { h: [], a: [] };
  const stats = { h: { shots: 0, sot: 0 }, a: { shots: 0, sot: 0 } };
  const pickScorer = xi => {
    const pool = xi.flatMap(p => Array(p.pos === 'AT' ? 8 : p.pos === 'MF' ? 3 : p.pos === 'DF' ? 1 : 0).fill(p));
    return pool.length ? pick(pool) : xi[0];
  };
  for (let min = 1; min <= 90; min++) {
    for (const side of ['h', 'a']) {
      const my = side === 'h' ? hs : as, opp = side === 'h' ? as : hs;
      const c = side === 'h' ? hc : ac, xi = side === 'h' ? hXI : aXI;
      const r = clamp(my / opp, 0.6, 1.7);
      if (Math.random() < 0.13 * r * r) {
        const shooter = pickScorer(xi);
        stats[side].shots++;
        if (Math.random() < 0.105 * r) {
          stats[side].sot++;
          side === 'h' ? hg++ : ag++;
          shooter.sg++;
          scorers[side].push(shooter.name + " " + min + "'");
          let txt = `⚽ ${min}' GOAL! ${shooter.name} scores for ${c.s}!`;
          const mates = xi.filter(p => p !== shooter && p.pos !== 'GK');
          if (Math.random() < 0.65 && mates.length) { const a2 = pick(mates); a2.sa++; txt += ` (assist: ${a2.name})`; }
          ev.push({ min, txt, goal: side, score: `${hg}-${ag}` });
        } else {
          if (Math.random() < 0.35) stats[side].sot++; // on target but kept out
          if (detailed && Math.random() < 0.25)
            ev.push({ min, txt: `${min}' ${shooter.name} (${c.s}) shoots — ${pick(['saved!', 'just wide!', 'off the bar!', 'blocked!'])}` });
        }
      }
    }
  }
  const ratings = [];
  for (const [c, xi, gf, ga] of [[hc, hXI, hg, ag], [ac, aXI, ag, hg]]) {
    const res = gf > ga ? 1 : gf < ga ? -1 : 0;
    c.morale = clamp(c.morale + res * 4 + (res === 0 ? 1 : 0), 30, 95);
    for (const p of xi) {
      p.apps++;
      p.fit = clamp(p.fit - rnd(8, 15), 20, 100);
      if (Math.random() < 0.035) { p.injury = 5 + R(25); if (detailed) ev.push({ min: 90, txt: `🩹 ${p.name} (${c.s}) picked up an injury (${p.injury} days).` }); }
      const g = scorers.h.concat(scorers.a).filter(s => s.startsWith(p.name + ' ')).length;
      if (detailed) ratings.push({ club: c.id, name: p.name, pos: p.pos, img: p.img, ovr: p.ovr, r: Math.round(clamp(6.4 + g * 1.2 + res * 0.4 + rnd(-0.7, 0.7), 4, 10) * 10) / 10 });
    }
  }
  stats.h.poss = Math.round(clamp(50 + (hs - as) * 2.2, 30, 70));
  stats.a.poss = 100 - stats.h.poss;
  return { hg, ag, ev, scorers, ratings, stats };
}

function playDay(G) {
  const todays = G.fixtures.filter(f => f.t === G.time && !f.pl);
  const out = { others: [], user: null };
  for (const f of todays) {
    const hc = G.clubs[f.h], ac = G.clubs[f.a];
    const isUser = f.h === G.userClub || f.a === G.userClub;
    const res = simMatch(G, hc, ac, isUser);
    f.hg = res.hg; f.ag = res.ag; f.pl = true;
    if (isUser) {
      out.user = { f, ...res };
      const me = G.clubs[G.userClub];
      if (f.h === G.userClub) {
        const gate = Math.round(clamp(initialBudget(me) * 0.03, 50e3, 5e6) / 1e4) * 1e4;
        me.budget += gate;
        G.tx.push({ t: G.time, txt: 'Matchday gate receipts', amt: gate });
      }
    } else out.others.push(f);
  }
  if (todays.length) progressComps(G);
  if (G.fixtures.every(f => f.pl)) G.seasonOver = true;
  return out;
}

// ---------- tables ----------
function table(G, comp, subset, group) {
  const clubs = subset ? subset.map(id => G.clubs[id]) : leagueClubs(G, +comp.slice(1));
  const rows = new Map(clubs.map(c => [c.id, { id: c.id, name: c.n, short: c.s, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }]));
  for (const f of G.fixtures) {
    if (f.c !== comp || !f.pl || (group !== undefined && f.g !== group)) continue;
    const h = rows.get(f.h), a = rows.get(f.a);
    if (!h || !a) continue;
    h.p++; a.p++; h.gf += f.hg; h.ga += f.ag; a.gf += f.ag; a.ga += f.hg;
    if (f.hg > f.ag) { h.w++; h.pts += 3; a.l++; }
    else if (f.hg < f.ag) { a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  }
  return [...rows.values()].sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf);
}

// ---------- calendar ----------
const windowOpen = G => [0, 5, 6, 7].includes(new Date(G.time).getUTCMonth()); // Jan + Jun–Aug
const wageBill = c => c.players.reduce((s, p) => s + p.wage, 0);
function news(G, txt) { G.news.unshift({ t: G.time, txt }); if (G.news.length > 80) G.news.length = 80; }

function advanceDay(G) {
  G.time += DAY;
  const d = new Date(G.time);
  for (const c of G.clubs) for (const p of c.players) {
    if (p.injury > 0) p.injury--;
    p.fit = clamp(p.fit + 3, 20, 100);
  }
  const me = G.clubs[G.userClub];
  me.budget -= wageBill(me) / 7;
  if (d.getUTCDate() === 1) { // monthly broadcast money keeps real wage bills payable
    const TV = { 'Premier League': 12e6, 'La Liga': 8e6, 'Bundesliga': 7e6, 'Serie A': 6.5e6, 'Ligue 1': 5e6, 'Primeira Liga': 2.5e6, 'Saudi Pro League': 6e6, 'MLS': 3e6, 'Süper Lig': 2e6 };
    const tv = TV[DB.leagues[me.lg].name] || 1e6;
    me.budget += tv;
    G.tx.push({ t: G.time, txt: 'Broadcast revenue', amt: tv });
  }
  if ((d.getUTCMonth() === 8 || d.getUTCMonth() === 1) && d.getUTCDate() === 1) news(G, '🚪 The transfer window has closed.');
  if (G.seasonOver) return 'seasonEnd';
  if (G.fixtures.some(f => f.t === G.time && !f.pl)) {
    if (G.fixtures.some(f => f.t === G.time && !f.pl && (f.h === G.userClub || f.a === G.userClub))) return 'match';
    playDay(G); // world plays on without you
  }
  if (windowOpen(G)) { // after fixtures so an offer never swallows a match day
    if (R(3) === 0) aiTransfers(G, 4);
    if (Math.random() < 0.05 && makeOffer(G)) return 'offer';
  }
  return null;
}

// ---------- AI transfers ----------
function aiTransfers(G, n) {
  for (let i = 0; i < n; i++) {
    const buyer = pick(G.clubs);
    if (buyer.id === G.userClub || buyer.players.length >= 32) continue;
    const L = DB.leagues[buyer.lg];
    const pw = power(buyer);
    const cands = [];
    for (const seller of G.clubs) {
      if (seller.id === buyer.id || seller.id === G.userClub || seller.players.length <= 19) continue;
      for (const p of seller.players) {
        if (p.value > buyer.budget * (L.rich ? 1 : 0.7)) continue;
        if (L.rich ? (p.ovr < 80 || p.age < 25) : L.name === 'MLS' ? p.age < 30 && p.ovr > pw + 4 : Math.abs(p.ovr - pw) > 6) continue;
        cands.push([p, seller]);
      }
    }
    if (!cands.length) continue;
    const [p, seller] = pick(cands);
    const fee = Math.round(p.value * (L.rich ? rnd(1.3, 1.8) : rnd(0.95, 1.3)));
    if (fee > buyer.budget) continue;
    seller.players.splice(seller.players.indexOf(p), 1);
    buyer.players.push(p);
    buyer.budget -= fee; seller.budget += fee;
    p.years = 2 + R(3); p.listed = false;
    if (p.ovr >= 82 || fee >= 40e6) news(G, `🔁 ${p.name} (${p.ovr}) joins ${buyer.n} from ${seller.n} for €${(fee / 1e6).toFixed(1)}M.`);
  }
}
function makeOffer(G) { // AI bids for the user's stars during windows
  const me = G.clubs[G.userClub];
  const stars = me.players.slice().sort((a, b) => b.value - a.value).slice(0, 4);
  const p = pick(stars);
  if (!p || p.value < 2e6) return false;
  const rich = Math.random() < 0.4;
  const pool = G.clubs.filter(c => c.id !== G.userClub && (rich ? DB.leagues[c.lg].rich : power(c) >= p.ovr - 4) && c.budget > p.value);
  if (!pool.length) return false;
  const buyer = pick(pool);
  const fee = Math.round(p.value * (DB.leagues[buyer.lg].rich ? rnd(1.3, 2.0) : rnd(0.9, 1.2)) / 1e5) * 1e5;
  G.pendingOffer = { cid: buyer.id, pid: p.id, fee };
  return true;
}
function acceptOffer(G) {
  const { cid, pid, fee } = G.pendingOffer;
  const me = G.clubs[G.userClub], buyer = G.clubs[cid];
  const p = me.players.find(p => p.id === pid);
  G.pendingOffer = null;
  if (!p) return;
  me.players.splice(me.players.indexOf(p), 1);
  buyer.players.push(p);
  me.budget += fee; buyer.budget -= fee;
  G.tx.push({ t: G.time, txt: `Sold ${p.name} to ${buyer.n}`, amt: fee });
  news(G, `💰 ${p.name} sold to ${buyer.n} for €${(fee / 1e6).toFixed(1)}M.`);
}

// ---------- user transfers ----------
function bid(G, p, seller, offer) {
  if (offer >= p.value * rnd(0.95, 1.25)) return { ok: true, fee: offer, wage: Math.round(p.wage * 1.25 / 100) * 100 };
  return { ok: false, counter: Math.round(p.value * 1.25 / 1e5) * 1e5 };
}
function signPlayer(G, p, seller, fee, wage) {
  const me = G.clubs[G.userClub];
  seller.players.splice(seller.players.indexOf(p), 1);
  me.players.push(p);
  me.budget -= fee; seller.budget += fee;
  p.wage = wage; p.years = 4; p.listed = false;
  G.tx.push({ t: G.time, txt: 'Signed ' + p.name, amt: -fee });
  news(G, `✍️ ${p.name} signs for ${me.n} for €${(fee / 1e6).toFixed(1)}M!`);
}
function sellPlayer(G, p) {
  const buyer = pick(G.clubs.filter(c => c.id !== G.userClub));
  const fee = Math.round(p.value * rnd(0.8, 1.05) / 1e5) * 1e5;
  return { buyer, fee };
}
function completeSale(G, p, buyer, fee) {
  const me = G.clubs[G.userClub];
  me.players.splice(me.players.indexOf(p), 1);
  buyer.players.push(p);
  me.budget += fee;
  G.tx.push({ t: G.time, txt: 'Sold ' + p.name + ' to ' + buyer.n, amt: fee });
  news(G, `💰 ${p.name} sold to ${buyer.n} for €${(fee / 1e6).toFixed(1)}M.`);
}

// ---------- season end ----------
function developPlayer(p) {
  let d = 0;
  if (p.age <= 21) d = rnd(1, 4); else if (p.age <= 27) d = rnd(0, 2);
  else if (p.age >= 33) d = -rnd(2, 4); else if (p.age >= 31) d = -rnd(0, 2);
  if (d > 0) d = Math.min(d, p.pot - p.ovr);
  d = Math.round(d);
  p.ovr = clamp(p.ovr + d, 30, 99);
  p.a = p.a.map(v => Math.round(clamp(v + d * rnd(0.7, 1.3), 20, 99)));
  p.value = calcValue(p);
}

function endSeason(G) {
  const me = G.clubs[G.userClub];
  const userLg = me.lg, L = DB.leagues[userLg];
  G.lastTables = {};
  const champions = [];
  DB.leagues.forEach((LL, li) => {
    const tab = table(G, 'L' + li);
    G.lastTables[li] = tab.map(r => r.id);
    if (LL.level === 1) champions.push(`${LL.flag} ${LL.name}: ${tab[0].name}`);
    if (li === userLg) {
      G.userPos = tab.findIndex(r => r.id === G.userClub) + 1;
      if (G.userPos === 1) {
        G.trophies.push(`${LL.name} Champions — ${G.year}/${(G.year + 1) % 100}`);
        G.rep = clamp(G.rep + (LL.level === 1 ? 10 : 5), 0, 100);
      }
    }
  });
  const prize = Math.round((leagueClubs(G, userLg).length - G.userPos + 1) * (L.level === 1 ? 2e6 : 0.5e6) * (L.name === 'Premier League' ? 2 : 1));
  me.budget += prize;
  G.tx.push({ t: G.time, txt: `Season ${G.season} prize money (finished ${G.userPos})`, amt: prize });
  G.rep = clamp(G.rep + (G.userPos <= 4 ? 3 : G.userPos <= 10 ? 1 : -2), 0, 100);
  // promotion & relegation (bottom 3 ↔ top 3; nobody drops out of D2)
  const proms = [];
  DB.leagues.forEach((LL, li) => {
    if (LL.d2 == null) return;
    const down = G.lastTables[li].slice(-3), up = G.lastTables[LL.d2].slice(0, 3);
    for (const id of down) G.clubs[id].lg = LL.d2;
    for (const id of up) G.clubs[id].lg = li;
    proms.push(`${LL.flag} Promoted: ${up.map(id => G.clubs[id].n).join(', ')} — Relegated: ${down.map(id => G.clubs[id].n).join(', ')}`);
  });
  // awards from the user's league (all-competition stats)
  const lgPlayers = leagueClubs(G, userLg).flatMap(c => c.players.map(p => ({ p, c })));
  const snap = x => x ? { name: x.p.name, club: x.c.s, goals: x.p.sg, assists: x.p.sa, age: x.p.age } : null;
  const awards = {
    topScorer: snap(lgPlayers.slice().sort((a, b) => b.p.sg - a.p.sg)[0]),
    bestPlayer: snap(lgPlayers.slice().sort((a, b) => (b.p.sg + b.p.sa) - (a.p.sg + a.p.sa))[0]),
    bestYoung: snap(lgPlayers.filter(x => x.p.age <= 21).sort((a, b) => b.p.ovr - a.p.ovr)[0]),
  };
  // aging, growth, retirement, contracts, youth intake
  for (const c of G.clubs) {
    const country = DB.leagues[c.lg].country;
    for (const p of c.players.slice()) {
      p.age++;
      developPlayer(p);
      p.sg = 0; p.sa = 0; p.apps = 0; p.fit = 100; p.injury = 0;
      p.years--;
      if (p.age >= 35 && Math.random() < (p.age - 34) * 0.35) {
        c.players.splice(c.players.indexOf(p), 1);
        if (c.id === G.userClub || p.ovr >= 84) news(G, `👋 ${p.name} (${p.age}) has retired.`);
        continue;
      }
      if (p.years <= 0) {
        if (c.id !== G.userClub && Math.random() < 0.8) { p.years = 1 + R(3); continue; }
        c.players.splice(c.players.indexOf(p), 1);
        if (c.id === G.userClub) news(G, `📄 ${p.name} left on a free — contract expired.`);
      }
    }
    for (let i = 0; i < 3; i++) c.players.push(genYouth(country));
    c.budget = Math.max(c.budget, initialBudget(c));
    c.morale = 70;
  }
  news(G, `🌱 Youth academy: 3 new prospects joined every academy.`);
  G.season++; G.year++;
  G.time = Date.UTC(G.year, 6, 10);
  genSeason(G);
  return { userPos: G.userPos, prize, champions, proms, awards };
}

// ---------- new game ----------
function initialBudget(c) {
  const L = DB.leagues[c.lg];
  const sv = c.players.map(p => p.value).sort((a, b) => b - a).slice(0, 18).reduce((s, v) => s + v, 0);
  const mult = (L.rich ? 2.5 : 1) * (L.name === 'Premier League' ? 1.4 : 1) * (L.level === 2 ? 0.8 : 1);
  return Math.max(2e6, Math.round(sv * 0.12 * mult / 1e5) * 1e5);
}
function newGame(managerName, clubIdx) {
  nextId = 1;
  const G = {
    season: 1, year: 2026, time: Date.UTC(2026, 6, 10),
    managerName, userClub: clubIdx, rep: 30, trophies: [],
    news: [], tx: [], seasonOver: false, pendingOffer: null,
    clubs: DB.clubs.map((c, i) => ({
      id: i, n: c.n, s: c.s, lg: c.lg, c1: c.c1, c2: c.c2, t: c.t || 0,
      morale: 70, formation: '4-3-3', mentality: 'balanced',
      players: c.p.map(row => ({
        id: nextId++, name: row[0], nat: row[1], pos: row[2], age: row[3],
        ovr: row[4], pot: row[5], value: row[6], wage: row[7], years: row[8],
        a: row.slice(9, 15), img: row[15] || null, fit: 100, injury: 0, apps: 0, sg: 0, sa: 0, listed: false,
      })),
    })),
  };
  for (const c of G.clubs) c.budget = initialBudget(c);
  genSeason(G);
  news(G, `👔 ${managerName} appointed manager of ${G.clubs[clubIdx].n}. Welcome!`);
  return G;
}

const ENG = {
  DAY, FORMATIONS, newGame, advanceDay, playDay, table, bestXI, power, leagueClubs,
  windowOpen, bid, signPlayer, sellPlayer, completeSale, acceptOffer, endSeason, wageBill,
  genYouth, calcValue, news,
};
if (typeof module !== 'undefined') module.exports = ENG;

function rMarket() {

    <div class="row">
      <input placeholder="Search player…" value="${esc(window._mq || '')}" oninput="window._mq=this.value;renderHub()" style="width:180px">
      <select onchange="window._mlg=+this.value;renderHub()"><option value="-1">All leagues</option>${DATA.leagues.map((L, i) => `<option value="${i}" ${i === lgF ? 'selected' : ''}>${L.flag} ${esc(L.name)}</option>`).join('')}</select>
      ${['ALL', 'GK', 'DF', 'MF', 'AT'].map(x => `<button style="${posF === x ? 'background:var(--volt);color:#0a0e00' : ''}" onclick="window._mpos='${x}';renderHub()">${x}</button>`).join('')}
    </div>
    <table class="grid"><tr><th></th><th>Pos</th><th>Name</th><th>Age</th><th>OVR</th><th>Fit</th><th>G/A</th><th>Value</th><th>Club</th></tr>
    ${pool.slice(0, 80).map(x => playerRow(x.p, x.c.id, true)).join('')}</table>
    <p class="muted">Showing ${Math.min(80, pool.length)} of ${pool.length}. Click a player to bid.</p>`);
}
function rFinance() {
  const c = me();
  return card(`<h3>Finances</h3>
    <p>Balance: <b class="${c.budget < 0 ? 'red' : 'green'}">${money(c.budget)}</b> · Weekly wage bill: <b>${money(ENG.wageBill(c))}</b></p>
    <p class="muted">Income: monthly broadcast money, matchday gates, prize money, player sales. Outgoings: wages (daily), transfers.</p>`) +
    card(`<h3>Transactions</h3><table class="grid">
    ${G.tx.slice(-30).reverse().map(t => `<tr><td class="muted">${fdate(t.t).slice(0, 11)}</td><td>${esc(t.txt)}</td><td class="${t.amt < 0 ? 'red' : 'green'}">${money(t.amt)}</td></tr>`).join('') || '<tr><td class="muted">Nothing yet.</td></tr>'}</table>`);
}
function rClub() {
  const c = me();
  return card(`<h3>Tactics</h3><div class="row">
      Formation <select onchange="me().formation=this.value">${Object.keys(ENG.FORMATIONS).map(f => `<option ${c.formation === f ? 'selected' : ''}>${f}</option>`).join('')}</select>
      Mentality <select onchange="me().mentality=this.value">${['defensive', 'balanced', 'attacking'].map(m => `<option ${c.mentality === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
      <span class="muted">Team morale: ${c.morale}/100</span></div>`) +
    card(`<h3>Manager: ${esc(G.managerName)}</h3>
      <p>Reputation: <b>${G.rep}/100</b></p>
      <p>🏆 ${G.trophies.length ? G.trophies.map(esc).join('<br>🏆 ') : '<span class="muted">Trophy cabinet is empty. For now.</span>'}</p>`) +
    card(`<h3>News</h3>${G.news.map(n => `<p><span class="muted">${fdate(n.t).slice(5, 11)}</span> ${esc(n.txt)}</p>`).join('') || '<p class="muted">Quiet day.</p>'}`);
}

// ---------- player modal (FUT card) ----------
function findPlayer(id, clubId) { return G.clubs[clubId].players.find(p => p.id === id); }
function openPlayer(id, clubId) {
  const p = findPlayer(id, clubId), own = clubId === G.userClub, c = G.clubs[clubId];
  const open = ENG.windowOpen(G);
  const labels = p.pos === 'GK' ? ['DIV', 'HAN', 'KIC', 'REF', 'SPE', 'POS'] : ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
  let actions;
  if (own) {
    actions = `<div class="row" style="margin-top:12px;justify-content:center">
      <button onclick="renew(${id})">📄 Renew (3y, +20% wage)</button>
      <button ${open ? '' : 'disabled'} onclick="askSell(${id})">💰 Sell</button>
      <button onclick="releasePlayer(${id})">🗑 Release</button></div>
      ${open ? '' : '<p class="muted" style="text-align:center">Selling only during a transfer window.</p>'}`;
  } else {
    actions = `<div class="row" style="margin-top:12px;justify-content:center">
      <input id="bid-amt" type="number" step="100000" value="${Math.round(p.value * 1.1)}" style="width:160px">
      <button class="primary" ${open ? '' : 'disabled'} onclick="makeBid(${id},${clubId})">Make bid</button></div>
      <p class="muted" style="text-align:center" id="bid-msg">${open ? 'Asking price around ' + money(p.value * 1.15) : 'Window closed — come back in summer or January.'}</p>`;
  }
  $('modal').innerHTML = `
    <div class="fut ${tier(p.ovr)}">
      <div class="bigno"><b>${p.ovr}</b>${p.pos}</div>
      <img class="pface" src="${faceURL(p, true)}" onerror="this.onerror=null;this.src=FACE0">
      <div class="pname">${esc(p.name)}</div>
      <div class="stats">${p.a.map((v, i) => `<span><b>${v}</b> ${labels[i]}</span>`).join('')}</div>
    </div>
    <p style="text-align:center;margin-top:12px">${logo(c, 22)} <b>${esc(c.n)}</b> <span class="muted">· ${DATA.leagues[c.lg].flag} ${esc(DATA.leagues[c.lg].name)} · ${esc(p.nat)} · Age ${p.age}${p.youth ? ' · 🌱 academy product' : ''}</span></p>
    <p style="text-align:center" class="muted">Potential ~${p.pot} · Value <b style="color:var(--txt)">${money(p.value)}</b> · ${money(p.wage)}/wk, ${p.years}y left · Fit ${p.fit}% · ${p.sg}G ${p.sa}A in ${p.apps} apps ${p.injury ? `· <span class="inj">injured ${p.injury}d</span>` : ''}</p>
    ${actions}<div class="row" style="margin-top:12px;justify-content:center"><button onclick="closeModal()">Close</button></div>`;
  $('modal-bg').classList.add('on');
}
function closeModal() { $('modal-bg').classList.remove('on'); renderHub(); }
function renew(id) {
  const p = findPlayer(id, G.userClub);
  p.years = 3; p.wage = Math.round(p.wage * 1.2 / 100) * 100;
  ENG.news(G, `📄 ${p.name} signed a new 3-year deal.`);
  openPlayer(id, G.userClub);
}
function releasePlayer(id) {
  const p = findPlayer(id, G.userClub);
  if (me().players.length <= 16) return alert('Squad too small to release anyone (min 16).');
  if (!confirm(`Release ${p.name}? You pay 6 months of wages (${money(p.wage * 26)}).`)) return;
  me().players.splice(me().players.indexOf(p), 1);
  me().budget -= p.wage * 26;
  G.tx.push({ t: G.time, txt: 'Released ' + p.name, amt: -p.wage * 26 });
  closeModal();
}
function askSell(id) {
  const p = findPlayer(id, G.userClub);
  if (me().players.length <= 16) return alert('Squad too small to sell (min 16).');
  const { buyer, fee } = ENG.sellPlayer(G, p);
  if (confirm(`${buyer.n} offer ${money(fee)} for ${p.name}. Accept?`)) {
    ENG.completeSale(G, p, buyer, fee);
    closeModal();
  }
}
function makeBid(id, clubId) {
  const p = findPlayer(id, clubId), seller = G.clubs[clubId];
  const offer = Number($('bid-amt').value) || 0;
  if (offer > me().budget) return $('bid-msg').textContent = 'You cannot afford that bid.';
  const r = ENG.bid(G, p, seller, offer);
  if (!r.ok) {
    $('bid-amt').value = r.counter;
    return $('bid-msg').textContent = `Bid rejected. ${seller.s} counter at ${money(r.counter)}.`;
  }
  if (!confirm(`Bid accepted! ${p.name} wants ${money(r.wage)}/wk on a 4-year deal (${money(r.wage * 208)} total wages). Sign him?`)) return;
  ENG.signPlayer(G, p, seller, r.fee, r.wage);
  closeModal();
}

// ---------- continue ----------
function doContinue() {
  for (let i = 0; i < 500; i++) {
    const ev = ENG.advanceDay(G);
    if (ev === 'match') return prepMatch();
    if (ev === 'seasonEnd') return endSeasonUI();
    if (ev === 'offer') {
      const { cid, pid, fee } = G.pendingOffer;
      const buyer = G.clubs[cid], p = me().players.find(p => p.id === pid);
      if (p && confirm(`💰 ${buyer.n} (${DATA.leagues[buyer.lg].flag} ${DATA.leagues[buyer.lg].name}) bid ${money(fee)} for ${p.name} (value ${money(p.value)}). Accept?`)) {
        ENG.acceptOffer(G);
      } else G.pendingOffer = null;
    }
  }
}

// ---------- match day ----------
function stinger(f, then) { // FC-style loading flash into the match
  $('stinger').innerHTML = `<div class="side">${logo(G.clubs[f.h], 92)}<h3>${esc(G.clubs[f.h].n)}</h3></div>
    <div class="vs">VS</div>
    <div class="side">${logo(G.clubs[f.a], 92)}<h3>${esc(G.clubs[f.a].n)}</h3></div>`;
  $('stinger').classList.add('show');
  setTimeout(() => { $('stinger').classList.remove('show'); then && then(); }, 850);
}
function pitchHTML(club, xi) {
  const lines = [[xi.filter(p => p.pos === 'AT'), 20], [xi.filter(p => p.pos === 'MF'), 46], [xi.filter(p => p.pos === 'DF'), 71], [xi.filter(p => p.pos === 'GK'), 90]];
  let chips = '';
  for (const [ps, y] of lines)
    ps.forEach((p, i) => chips += `<div class="chip" style="left:${(i + 1) / (ps.length + 1) * 100}%;top:${y}%">
      ${face(p, 40)}<div class="nm">${esc(p.name.split(' ').pop())} <b>${p.ovr}</b></div></div>`);
  return `<div class="pitch">${chips}</div>`;
}
function prepMatch() {
  const f = G.fixtures.find(x => x.t === G.time && !x.pl && (x.h === G.userClub || x.a === G.userClub));
  const home = f.h === G.userClub, opp = G.clubs[home ? f.a : f.h];
  const oppStar = opp.players.slice().sort((a, b) => b.ovr - a.ovr)[0];
  const xi = ENG.bestXI(me());
  $('match-pre').style.display = 'block';
  $('match-live').style.display = 'none';
  $('match-post').innerHTML = '';
  $('match-pre').innerHTML = `<div class="card"><div class="in" style="text-align:center">
    <span class="eyebrow">Match day · ${esc(compLabel(f))} · ${fdate(G.time)}</span>
    <div class="row" style="justify-content:center;gap:30px;margin:16px 0">
      <div>${logo(G.clubs[f.h], 84)}<h3>${esc(G.clubs[f.h].n)}</h3></div>
      <h2 class="mega" style="font-size:44px;color:var(--volt)">VS</h2>
      <div>${logo(G.clubs[f.a], 84)}<h3>${esc(G.clubs[f.a].n)}</h3></div>
    </div>
    <p class="muted">Opponent squad ${Math.round(ENG.power(opp))} OVR · danger man: <b style="color:var(--txt)">${esc(oppStar.name)} (${oppStar.ovr})</b> · morale ${opp.morale} · you are ${home ? 'HOME' : 'AWAY'}</p>
    <h3 style="margin-top:16px">Your XI — ${me().formation} (${me().mentality})</h3>
    ${pitchHTML(me(), xi)}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="primary" style="font-size:21px;padding:13px 38px" onclick="playMatch()">Kick off ▶</button></div>
  </div></div>`;
  $('h-date').textContent = fdate(G.time);
  stinger(f, null);
  show('match');
}

let matchRes = null, liveMin = 0, shownEv = 0;
function scorebarHTML(f, h, a) {
  return `<span class="tm">${logo(G.clubs[f.h], 38)} ${esc(G.clubs[f.h].s)}</span>
    <span class="sc">${h} – ${a}</span>
    <span class="tm">${esc(G.clubs[f.a].s)} ${logo(G.clubs[f.a], 38)}</span>`;
}
function flashGoal() {
  $('goalbanner').classList.remove('show');
  void $('goalbanner').offsetWidth;
  $('goalbanner').classList.add('show');
  setTimeout(() => $('goalbanner').classList.remove('show'), 1400);
}
function playMatch() {
  matchRes = ENG.playDay(G);
  autosave();
  const f = matchRes.user.f;
  $('match-pre').style.display = 'none';
  $('match-live').style.display = 'block';
  $('match-comp').textContent = compLabel(f);
  $('ticker').innerHTML = `<div class="muted">${fdate(G.time)} — we're underway!</div>`;
  liveMin = 0; shownEv = 0;
  $('scorebar').innerHTML = scorebarHTML(f, 0, 0);
  tickerTimer = setInterval(() => {
    liveMin++;
    if (liveMin > 90) return finishTicker();
    $('minute').textContent = liveMin + "'";
    const evs = matchRes.user.ev;
    let sb = null;
    while (shownEv < evs.length && evs[shownEv].min <= liveMin) {
      const e = evs[shownEv++];
      $('ticker').innerHTML += `<div class="${e.goal ? 'goal' : ''}">${esc(e.txt)}</div>`;
      $('ticker').scrollTop = 1e6;
      if (e.goal) sb = e.score;
    }
    if (sb) { const [h, a] = sb.split('-').map(Number); $('scorebar').innerHTML = scorebarHTML(f, h, a); flashGoal(); }
  }, 70);
}
function skipTicker() { finishTicker(); }
function finishTicker() {
  clearInterval(tickerTimer);
  $('goalbanner').classList.remove('show');
  const u = matchRes.user, f = u.f, st = u.stats;
  $('match-live').style.display = 'none';
  const won = (f.h === G.userClub && f.hg > f.ag) || (f.a === G.userClub && f.ag > f.hg);
  const drew = f.hg === f.ag;
  G.rep = Math.max(0, Math.min(100, G.rep + (won ? 1 : drew ? 0 : -1)));
  const myRatings = u.ratings.filter(r => r.club === G.userClub).sort((a, b) => b.r - a.r);
  const motm = u.ratings.slice().sort((a, b) => b.r - a.r)[0];
  const sameComp = matchRes.others.filter(o => o.c === f.c);
  const bar = (hv, av, lbl, hc, ac) => `<div class="statbar"><span>${hv}</span>
    <div class="bar" style="justify-content:flex-end"><i style="width:${Math.round(100 * hv / Math.max(1, hv + av))}%;background:${hc}"></i></div>
    <span class="lbl">${lbl}</span>
    <div class="bar"><i style="width:${Math.round(100 * av / Math.max(1, hv + av))}%;background:${ac}"></i></div><span style="text-align:right">${av}</span></div>`;
  $('match-post').innerHTML = `<div class="card"><div class="in" style="text-align:center">
    <span class="eyebrow">Full time · ${esc(compLabel(f))}</span>
    <div class="scorebar" style="margin:12px 0">${scorebarHTML(f, f.hg, f.ag)}</div>
    <p class="muted">${[...u.scorers.h, ...u.scorers.a].map(esc).join(' · ') || 'No goals.'} ${won ? '🎉' : drew ? '' : '😞'}</p>
    <div style="max-width:580px;margin:16px auto">
      ${bar(st.h.poss, st.a.poss, 'Possession %', G.clubs[f.h].c1, G.clubs[f.a].c1)}
      ${bar(st.h.shots, st.a.shots, 'Shots', G.clubs[f.h].c1, G.clubs[f.a].c1)}
      ${bar(st.h.sot, st.a.sot, 'On target', G.clubs[f.h].c1, G.clubs[f.a].c1)}
    </div>
    <h3>⭐ Man of the Match</h3>
    <div class="row" style="justify-content:center">${face(motm, 56)}<div style="text-align:left"><b>${esc(motm.name)}</b><br>${ovrChip(motm.ovr)} <b style="color:var(--volt)">${motm.r.toFixed(1)}</b></div></div>
    <h3 style="margin-top:16px">Your player ratings</h3>
    <table class="grid" style="max-width:490px;margin:0 auto">${myRatings.map(r => `<tr><td>${face(r, 26)}</td><td class="pos-${r.pos}">${r.pos}</td><td style="text-align:left"><b>${esc(r.name)}</b></td><td><b style="color:${r.r >= 7.5 ? 'var(--volt)' : r.r < 6 ? '#ff6b6b' : 'inherit'}">${r.r.toFixed(1)}</b></td></tr>`).join('')}</table>
    ${sameComp.length ? `<h3 style="margin-top:16px">Elsewhere</h3><table class="grid" style="max-width:490px;margin:0 auto">${sameComp.slice(0, 12).map(o => `<tr><td style="text-align:right">${esc(G.clubs[o.h].s)} ${logo(G.clubs[o.h], 20)}</td><td style="text-align:center"><b>${o.hg}–${o.ag}</b></td><td>${logo(G.clubs[o.a], 20)} ${esc(G.clubs[o.a].s)}</td></tr>`).join('')}</table>` : ''}
    <div class="row" style="justify-content:center;margin-top:16px"><button class="primary" onclick="tab='table';enterHub()">Continue ▶</button></div>
  </div></div>`;
}

// ---------- season end ----------
function endSeasonUI() {
  const s = ENG.endSeason(G);
  autosave();
  enterHub();
  $('modal').innerHTML = `<h2>🏆 Season ${G.season - 1} Complete</h2>
    <p>You finished <b>${s.userPos}${['st', 'nd', 'rd'][s.userPos - 1] || 'th'}</b> and earned ${money(s.prize)}.</p>
    <div class="card flat"><b>CHAMPIONS</b><br>${s.champions.map(esc).join('<br>')}</div>
    <div class="card flat" style="margin-top:10px"><b>UP & DOWN</b><br>${s.proms.map(esc).join('<br>')}</div>
    <div class="card flat" style="margin-top:10px"><b>${esc(myLeague().name).toUpperCase()} AWARDS</b><br>
    ⚽ Golden Boot: <b>${esc(s.awards.topScorer.name)}</b> (${esc(s.awards.topScorer.club)}) — ${s.awards.topScorer.goals} goals<br>
    🌟 Player of the Season: <b>${esc(s.awards.bestPlayer.name)}</b> (${esc(s.awards.bestPlayer.club)})<br>
    🌱 Best Young Player: <b>${esc(s.awards.bestYoung.name)}</b> (${esc(s.awards.bestYoung.club)}, ${s.awards.bestYoung.age})</div>
    <p class="muted" style="margin-top:10px">Players aged, contracts ticked down, youth prospects arrived. Season ${G.season} starts in July.</p>
    <div class="row"><button class="primary" onclick="closeModal()">On to Season ${G.season} ▶</button></div>`;
  $('modal-bg').classList.add('on');
}

// ---------- boot ----------
(function boot() {
  // star strip on the menu, straight from the real dataset
  const want = ['K. Mbappé', 'E. Haaland', 'Lamine Yamal', 'M. Salah', 'V. Osimhen'];
  const faces = [];
  for (const c of DATA.clubs) for (const row of c.p) if (want.includes(row[0]) && row[15]) faces.push(row[15]);
  $('menu-faces').innerHTML = faces.slice(0, 5).map(f => `<img loading="lazy" src="https://cdn.sofifa.net/players/${f}/26_240.png" onerror="this.remove()">`).join('');
  $('src').textContent = 'Data: ' + DATA.source;
  renderSlots();
  setTimeout(() => $('splash').classList.add('off'), 1200);
})();
</script>
</body>
</html>
