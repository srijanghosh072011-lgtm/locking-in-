<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locking In FC — Career Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --c1:#c8102e; --c2:#ffffff; --volt:#d6ff3f; --bg:#05070c; --panel:#0f141d; --panel2:#0a0e16; --line:#ffffff14; --txt:#eef1f6; --mut:#8b95a8; --bez:cubic-bezier(0.32,0.72,0,1); }
  * { box-sizing:border-box; margin:0; }
  html { scrollbar-color:#2a3345 transparent; }
  body { font-family:'Barlow',system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100dvh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0; z-index:-2;
    background:radial-gradient(900px 500px at 12% -5%, color-mix(in srgb, var(--c1) 34%, transparent), transparent 65%),
               radial-gradient(700px 420px at 105% 108%, color-mix(in srgb, var(--c1) 18%, transparent), transparent 60%); }
  body::after { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.05;
    background:repeating-linear-gradient(115deg, #fff 0 1px, transparent 1px 46px); }
  h1,h2,h3,.disp { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.6px; }
  .mega { font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:1px; }
  h2 { font-size:28px; } h3 { font-size:19px; color:#fff; margin:6px 0; }
  button { font:inherit; cursor:pointer; border:0; border-radius:4px; padding:8px 14px; background:#1d2534; color:var(--txt); font-weight:600; transition:all .35s var(--bez); }
  button:hover { filter:brightness(1.3); transform:translateY(-1px); }
  button:active { transform:scale(.97); }
  button.primary { background:linear-gradient(100deg, var(--volt), #9ed400); color:#0a0e00;
    font-family:'Barlow Condensed'; text-transform:uppercase; font-weight:800; font-size:17px; letter-spacing:1.5px; padding:10px 26px;
    clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); border-radius:0; box-shadow:0 6px 24px -6px #d6ff3f55; }
  input, select { font:inherit; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:9px 10px; }
  input:focus, select:focus { outline:2px solid var(--volt); outline-offset:-1px; }
  .screen { display:none; max-width:1140px; margin:0 auto; padding:16px; }
  .screen.on { display:block; }
  .card { background:#ffffff08; border:1px solid var(--line); border-radius:18px; padding:7px; margin:14px 0; animation:rise .6s var(--bez) both; }
  .card > .in, .card.flat { background:linear-gradient(180deg,var(--panel),var(--panel2)); border-radius:12px; padding:16px; box-shadow:inset 0 1px 1px #ffffff10; }
  .card.flat { border-radius:12px; margin:0; animation:none; }
  #tabbody > .card:nth-child(2) { animation-delay:.08s } #tabbody > .card:nth-child(3) { animation-delay:.16s }
  @keyframes rise { from { opacity:0; transform:translateY(22px); filter:blur(5px); } to { opacity:1; transform:none; filter:none; } }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--mut); font-size:13px; }
  .eyebrow { display:inline-block; border:1px solid var(--line); background:#ffffff08; border-radius:999px; padding:3px 12px; font-size:10px; letter-spacing:.25em; text-transform:uppercase; color:var(--mut); }
  table.grid { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.grid th, table.grid td { padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); }
  table.grid th { color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:13px; letter-spacing:1.5px; font-weight:600; }
  table.grid tr.click { transition:all .3s var(--bez); }
  table.grid tr.click:hover { background:#ffffff0a; cursor:pointer; box-shadow:inset 3px 0 0 var(--volt); }
  table.grid tr.me { background:color-mix(in srgb, var(--c1) 16%, transparent); box-shadow:inset 3px 0 0 var(--c1); }
  .face { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#161d2b; vertical-align:middle; }
  .logo { object-fit:contain; vertical-align:middle; filter:drop-shadow(0 2px 6px #0009); }
  .ovr { display:inline-block; min-width:32px; text-align:center; font-family:'Barlow Condensed'; font-weight:800; font-size:16px; padding:2px 5px; color:#141414;
    clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); }
  .t-gold { background:linear-gradient(160deg,#f5d87c,#c9a33c); } .t-silver { background:linear-gradient(160deg,#d8dee8,#98a1b0); } .t-bronze { background:linear-gradient(160deg,#d0a06c,#96683c); }
  header#top { display:flex; align-items:center; gap:14px; padding:10px 20px; margin:10px auto 0; max-width:1140px;
    background:#0f141dd9; backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px;
    position:sticky; top:10px; z-index:5; flex-wrap:wrap; box-shadow:0 12px 40px -18px #000; }
  header#top .grow { flex:1; }
  #h-club { font-family:'Barlow Condensed'; font-size:23px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  nav { display:flex; gap:0; margin:16px 0 4px; flex-wrap:wrap; }
  nav button { background:none; border-radius:0; color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:17px; letter-spacing:1.5px; padding:10px 18px; position:relative; }
  nav button:hover { color:#fff; transform:none; }
  nav button.act { color:#fff; }
  nav button.act::after { content:''; position:absolute; left:14px; right:14px; bottom:2px; height:3px; background:var(--volt); transform:skewX(-20deg); }
  .hero { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--line); margin:14px 0 4px; padding:22px 26px;
    background:linear-gradient(105deg, color-mix(in srgb, var(--c1) 42%, #0a0e16) 0%, var(--panel2) 55%, #0a0e16 100%); animation:rise .6s var(--bez) both; }
  .hero::before { content:''; position:absolute; inset:0; opacity:.12; background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 26px); }
  .hero .heroface { position:absolute; right:14px; bottom:-12px; width:170px; height:170px; object-fit:contain; opacity:.95;
    filter:drop-shadow(0 8px 24px #000c); -webkit-mask-image:linear-gradient(#000 78%, transparent); mask-image:linear-gradient(#000 78%, transparent); }
  .hero .big { font-family:'Anton'; font-size:clamp(24px,4vw,40px); text-transform:uppercase; line-height:1.02; }
  .clubcard { background:#ffffff08; border:1px solid var(--line); border-radius:16px; padding:6px; cursor:pointer; width:212px; transition:all .4s var(--bez); animation:rise .5s var(--bez) both; }
  .clubcard:nth-child(2n){animation-delay:.05s} .clubcard:nth-child(3n){animation-delay:.1s}
  .clubcard .in { background:linear-gradient(165deg,var(--panel),var(--panel2)); border-radius:11px; padding:16px; text-align:center; }
  .clubcard:hover { transform:translateY(-4px) scale(1.02); border-color:var(--volt); box-shadow:0 18px 40px -18px #000; }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  #modal-bg { display:none; position:fixed; inset:0; background:#000000d5; backdrop-filter:blur(10px); z-index:10; align-items:center; justify-content:center; }
  #modal-bg.on { display:flex; }
  #modal { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; max-width:620px; width:94%; max-height:88vh; overflow:auto; animation:rise .45s var(--bez) both; }
  .fut { width:240px; margin:0 auto; padding:20px 14px 14px; text-align:center; color:#1c1508; position:relative; overflow:hidden;
    clip-path:polygon(0 6%,50% 0,100% 6%,100% 94%,50% 100%,0 94%); }
  .fut::after { content:''; position:absolute; inset:0; background:linear-gradient(115deg,transparent 30%,#ffffff3d 42%,transparent 55%); pointer-events:none; }
  .fut.t-gold { background:linear-gradient(165deg,#f8e7a9 0%,#e9c95c 45%,#b8912e 100%); }
  .fut.t-silver { background:linear-gradient(165deg,#eef1f6 0%,#c3cbd8 45%,#8b95a6 100%); }
  .fut.t-bronze { background:linear-gradient(165deg,#e8c39a 0%,#c99a64 45%,#8a5f33 100%); }
  .fut .bigno { position:absolute; left:18px; top:18px; text-align:center; font-family:'Anton'; line-height:.95; }
  .fut .bigno b { font-size:42px; display:block; font-weight:400; }
  .fut img.pface { width:120px; height:120px; object-fit:cover; }
  .fut .pname { font-family:'Anton'; font-size:21px; text-transform:uppercase; border-top:2px solid #00000028; border-bottom:2px solid #00000028; margin:4px 8px; padding:3px 0; }
  .fut .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 8px; font-size:14px; padding:5px 12px 0; font-weight:600; }
  .fut .stats b { font-size:17px; }
  .pitch { position:relative; width:min(440px,94vw); aspect-ratio:3/3.5; margin:10px auto; border:2px solid #ffffff3a; border-radius:10px;
    background:repeating-linear-gradient(0deg,#0e6d2c 0 11%,#0b5f25 11% 22%); overflow:hidden; box-shadow:0 24px 60px -24px #000; }
  .pitch.dark { background:repeating-linear-gradient(0deg,#10141c 0 11%,#0c1017 11% 22%); border-color:#ffffff22; }
  .pitch::before { content:''; position:absolute; left:50%; top:-9%; width:34%; aspect-ratio:1; border:2px solid #ffffff3a; border-radius:50%; transform:translateX(-50%); }
  .pitch::after { content:''; position:absolute; left:25%; bottom:0; width:50%; height:14%; border:2px solid #ffffff3a; border-bottom:0; }
  .chip { position:absolute; transform:translate(-50%,-50%); text-align:center; width:80px; }
  .chip img { width:40px; height:40px; border-radius:50%; background:#0a0e16d5; border:2px solid #fffc; object-fit:cover; }
  .chip .nm { font-size:11px; font-weight:700; background:#0a0e16e5; border-radius:3px; padding:1px 4px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chip .nm b { color:var(--volt); }
  .chip .rl { font-size:9.5px; color:var(--mut); background:#0a0e16e5; border-radius:3px; padding:0 3px; text-transform:uppercase; letter-spacing:.5px; }
  /* draggable tactics board */
  .tboard { position:relative; width:min(560px,94vw); aspect-ratio:3/4.05; margin:6px auto 2px; border-radius:12px; overflow:hidden; touch-action:none;
    background:linear-gradient(0deg,#0c1017,#0d141d); border:1px solid #ffffff20; box-shadow:0 24px 60px -24px #000; user-select:none; }
  .tboard .grass { position:absolute; inset:0; background:repeating-linear-gradient(0deg,#12331f 0 9%,#0f2c1b 9% 18%); opacity:.9; }
  .tboard .lines { position:absolute; inset:14px; border:2px solid #ffffff33; border-radius:4px; }
  .tboard .lines::before { content:''; position:absolute; left:0; right:0; top:50%; height:0; border-top:2px solid #ffffff2e; }
  .tboard .lines::after { content:''; position:absolute; left:50%; top:50%; width:26%; aspect-ratio:1; transform:translate(-50%,-50%); border:2px solid #ffffff2e; border-radius:50%; }
  .tboard .box { position:absolute; left:26%; width:48%; height:15%; border:2px solid #ffffff2a; }
  .tboard .box.t { top:0; border-top:0; } .tboard .box.b { bottom:0; border-bottom:0; }
  .tok { position:absolute; transform:translate(-50%,-50%); width:70px; text-align:center; cursor:grab; z-index:2; transition:box-shadow .15s; }
  .tok.drag { cursor:grabbing; z-index:9; }
  .tok .disc { width:46px; height:46px; margin:0 auto; border-radius:50%; background:#0a0e16; border:2px solid var(--volt); object-fit:cover; box-shadow:0 6px 16px -6px #000, 0 0 0 3px #0a0e1699; display:block; }
  .tok .kd { position:absolute; top:-6px; right:8px; font-size:9px; font-weight:800; background:var(--volt); color:#0a0e00; border-radius:8px; padding:0 5px; letter-spacing:.4px; }
  .tok .nm { font-size:11px; font-weight:800; margin-top:2px; background:#0a0e16e8; border-radius:4px; padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tok .nm b { color:var(--volt); }
  .tok .rl { font-size:9px; color:#cfe08a; background:#0a0e16e8; border-radius:4px; padding:0 3px; text-transform:uppercase; letter-spacing:.4px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tok .fc { font-size:8.5px; color:var(--mut); }
  .thint { text-align:center; font-size:12px; color:var(--mut); margin:4px 0 2px; }
  .seg { display:flex; gap:4px; flex-wrap:wrap; margin:4px 0 2px; }
  .seg button { flex:1; min-width:60px; padding:7px 6px; font-size:12.5px; font-weight:700; border-radius:8px; border:1px solid var(--line); background:#0e1420; color:var(--mut); cursor:pointer; text-transform:capitalize; }
  .seg button.on { background:var(--volt); color:#0a0e00; border-color:var(--volt); }
  .meter { margin:7px 0; } .meter .lb { display:flex; justify-content:space-between; font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .meter .bar { height:8px; border-radius:6px; background:#0e1420; overflow:hidden; }
  .meter .bar i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#5b7,#d6ff3f); }
  .roleopt { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 2px; }
  .roleopt button { padding:8px 10px; border-radius:9px; border:1px solid var(--line); background:#0e1420; color:var(--txt); font-weight:700; font-size:13px; cursor:pointer; }
  .roleopt button.on { border-color:var(--volt); box-shadow:inset 0 0 0 1px var(--volt); color:var(--volt); }
  .scorebar { display:flex; align-items:center; justify-content:center; gap:20px; padding:14px 22px; position:relative; overflow:hidden;
    background:linear-gradient(90deg, color-mix(in srgb, var(--c1) 30%, var(--panel2)), var(--panel2) 35%, var(--panel2) 65%, #131a28); border:1px solid var(--line); border-radius:14px; }
  .scorebar::before { content:''; position:absolute; inset:0; opacity:.1; background:repeating-linear-gradient(115deg,#fff 0 2px,transparent 2px 22px); }
  .scorebar .sc { font-family:'Anton'; font-size:52px; min-width:130px; text-align:center; }
  .scorebar .tm { font-family:'Barlow Condensed'; font-size:26px; font-weight:800; text-transform:uppercase; display:flex; align-items:center; gap:12px; }
  #minute { font-family:'Anton'; font-size:24px; color:var(--volt); text-align:center; margin-top:8px; }
  #stage { position:relative; width:100%; aspect-ratio:16/9; margin-top:12px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#04060a; box-shadow:0 24px 60px -24px #000; }
  #stage canvas { display:block; width:100%; height:100%; }
  #stage::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 100% at 50% 40%, transparent 62%, #000000a8 100%); }
  #stage .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-family:'Anton'; font-size:clamp(30px,6vw,64px); text-transform:uppercase; color:#fff; background:#04060a88; letter-spacing:3px; }
  #ticker { background:#04060a; border:1px solid var(--line); border-radius:12px; padding:12px; height:130px; overflow-y:auto; font-size:14px; line-height:1.8; margin-top:12px; }
  #ticker div { animation:rise .4s var(--bez) both; }
  #ticker .goal { color:var(--volt); font-weight:700; }
  #goalbanner { position:fixed; left:0; right:0; top:38%; z-index:8; display:none; pointer-events:none; }
  #goalbanner .in { font-family:'Anton'; font-size:clamp(40px,9vw,90px); text-transform:uppercase; color:#0a0e00; text-align:center;
    background:linear-gradient(100deg,var(--volt),#9ed400); transform:skewX(-8deg) scaleY(.96); padding:4px 0; box-shadow:0 0 80px #d6ff3f66; }
  #goalbanner.show { display:block; animation:slam .45s var(--bez) both; }
  @keyframes slam { from { opacity:0; transform:translateX(-40px) } to { opacity:1; transform:none } }
  .statbar { display:grid; grid-template-columns:56px 1fr 130px 1fr 56px; gap:8px; align-items:center; margin:7px 0; font-weight:700; }
  .statbar .lbl { text-align:center; color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:13px; letter-spacing:1.5px; }
  .statbar .bar { height:9px; border-radius:5px; background:#ffffff10; overflow:hidden; display:flex; }
  .statbar .bar i { display:block; height:100%; transition:width 1s var(--bez); }
  #splash { position:fixed; inset:0; z-index:20; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; transition:opacity .6s var(--bez); }
  #splash.off { opacity:0; pointer-events:none; }
  #splash .mega { font-size:clamp(44px,9vw,90px); }
  #splash .bar { width:min(360px,70vw); height:4px; background:#ffffff14; border-radius:2px; overflow:hidden; }
  #splash .bar i { display:block; height:100%; width:0; background:var(--volt); animation:load 1.1s var(--bez) forwards; }
  @keyframes load { to { width:100% } }
  #stinger { position:fixed; inset:0; z-index:9; background:#04060af0; backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; gap:34px; }
  #stinger.show { display:flex; }
  #stinger .side { animation:rise .5s var(--bez) both; text-align:center; }
  #stinger .side:last-child { animation-delay:.12s }
  #stinger .vs { font-family:'Anton'; font-size:60px; color:var(--volt); animation:rise .5s var(--bez) .06s both; }
  .check { line-height:1.9; font-size:14.5px; }
  .check .ok::before { content:'✓ '; color:var(--volt); font-weight:800; }
  .check .warn::before { content:'! '; color:#ffb347; font-weight:800; }
  .inj { color:#ff6b6b; } .pos-GK{color:#f2c14e} .pos-DF{color:#6bb3ff} .pos-MF{color:#7ee08a} .pos-AT{color:#ff8f6b}
  .green { color:#7ee08a; } .red { color:#ff6b6b; }
  #menu { text-align:center; padding-top:6vh; }
  #menu .faces { display:flex; justify-content:center; margin-bottom:-6px; }
  #menu .faces img { width:84px; height:84px; object-fit:cover; margin:0 -8px; filter:drop-shadow(0 10px 22px #000);
    -webkit-mask-image:linear-gradient(#000 72%,transparent); mask-image:linear-gradient(#000 72%,transparent); }
  #menu h1 { font-family:'Anton'; font-size:clamp(48px,9vw,86px); letter-spacing:2px;
    background:linear-gradient(90deg,#fff 40%,var(--volt)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menu .card { max-width:480px; margin:16px auto; text-align:left; }
  @media (max-width:700px){ .scorebar .sc{font-size:36px;min-width:90px} .hero .heroface{display:none} }
</style>
</head>
<body>

<div id="splash"><div class="mega">Locking In FC</div><div class="eyebrow">Career Mode · Season 2026/27</div><div class="bar"><i></i></div></div>
<div id="goalbanner"><div class="in">⚽ GOAL!</div></div>
<div id="stinger"></div>

<header id="top" style="display:none">
  <span id="h-logo"></span>
  <div><span id="h-club"></span><div class="muted" id="h-mgr"></div></div>
  <div class="grow"></div>
  <div style="text-align:right"><b id="h-date" class="disp" style="font-size:18px"></b><div class="muted" id="h-money"></div></div>
  <button onclick="saveGame()">💾 Save</button>
  <button onclick="toMenu()">Menu</button>
  <button class="primary" id="h-cont" onclick="doContinue()">Continue ▶</button>
</header>

<div id="menu" class="screen on">
  <div class="faces" id="menu-faces"></div>
  <h1>Locking In FC</h1>
  <p class="muted"><span class="eyebrow">real clubs · real players · real ratings · 3D matches</span><br><br><span id="src"></span></p>
  <div class="card"><div class="in">
    <h3>New Career</h3>
    <div class="row"><input id="mgr-name" placeholder="Your manager name" value="The Boss">
    <button class="primary" onclick="toPick()">Start ▶</button></div>
  </div></div>
  <div class="card"><div class="in"><h3>Load Career</h3><div id="slots"></div></div></div>
</div>

<div id="pick" class="screen">
  <h2>Choose a league</h2>
  <div class="row" id="leaguelist"></div>
  <div id="clubpick"></div>
</div>

<div id="hub" class="screen">
  <div id="hero"></div>
  <nav id="tabs"></nav>
  <div id="tabbody"></div>
</div>

<div id="match" class="screen">
  <div id="match-pre"></div>
  <div id="match-live" style="display:none">
    <p class="muted disp" id="match-comp" style="text-align:center;margin-top:10px;letter-spacing:2px"></p>
    <div class="scorebar" id="scorebar"></div>
    <div id="minute"></div>
    <div id="stage"><div class="overlay" id="stage-overlay"></div></div>
    <div id="ticker"></div>
    <div class="row" style="margin-top:12px;justify-content:center">
      <button onclick="skipTicker()">⏩ Skip to full time</button>
      <button id="mutebtn" onclick="AU.toggle()"></button>
    </div>
  </div>
  <div id="match-post"></div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="three.min.js"></script>
<script>
'use strict';
// surface failures instead of silently dead buttons
window.onerror = (msg) => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#a11;color:#fff;padding:10px 16px;z-index:99;font-size:14px';
  d.textContent = '⚠ Error: ' + msg;
  document.body.appendChild(d);

function m3Anim(p, dt, moving, spd) {

function passBall(st, to, arcBoost = 0) {

function m3Frame(now) {
  const st = M3.st;
  if (!st || st.done) return;

  const dt = Math.min(0.05, (now - st.lastFrame) / 1000);
  st.lastFrame = now;
  const u = st.u, atkSgn = s => s === 'h' ? 1 : -1;
  // clock (runs during open play)
  st.min = Math.min(90, st.min + dt * (st.mode === 'open' ? 1000 / 115 : 0) * (1 / 8.7));
  const minI = Math.floor(st.min);
  $('minute').textContent = Math.max(1, minI) + "'";
  while (st.evIdx < u.ev.length && u.ev[st.evIdx].min <= minI) {
    const e = u.ev[st.evIdx++];
    $('ticker').innerHTML += `<div class="${e.goal ? 'goal' : ''}">${esc(e.txt)}</div>`;
    $('ticker').scrollTop = 1e6;
  }
  if (!st.htDone && st.min >= 45 && st.mode === 'open') {
    st.htDone = true; st.mode = 'ht'; st.modeT = 0;
    $('stage-overlay').textContent = 'Half Time'; $('stage-overlay').style.display = 'flex';
    AU.whistle(2);
  }
  if (st.min >= 90 && st.playIdx >= u.plays.length && st.mode === 'open') {
    st.done = true;
    AU.whistle(3);
    $('stage-overlay').textContent = 'Full Time'; $('stage-overlay').style.display = 'flex';
    setTimeout(finishTicker, 900);
    return;
  }
  if (st.mode === 'open' && st.playIdx < u.plays.length && st.min >= u.plays[st.playIdx].min) {
    const play = u.plays[st.playIdx++];
    const shooter = st.ps.find(p => p.side === play.side && p.name === play.name) || st.ps.find(p => p.side === play.side && p.pos === 'AT');
    st.poss = play.side;
    st.choreo = { play, shooter, stage: 'carry', t: 0 };
    st.mode = 'attack';
    passBall(st, shooter);
    AU.swell(0.18, 1.2);
  }
  st.modeT += dt;
  if (st.mode === 'intro') { // cinematic sweep down from above the centre circle
    const k = Math.min(1, st.modeT / 1.9);
    const e = 1 - Math.pow(1 - k, 3);
    M3.cam.position.set(0, 58 - 32 * e, 4 + 41 * e);
    M3.cam.lookAt(0, 0, 0);
    if (k >= 1) { st.mode = 'kickoff'; st.modeT = 0; AU.whistle(1); }
    M3.R.render(M3.scene, M3.cam);
    return;
  }
  if (st.mode === 'kickoff' && st.modeT > 0.7) st.mode = 'open';
  if (st.mode === 'ht' && st.modeT > 1.3) { $('stage-overlay').style.display = 'none'; st.mode = 'open'; }
  if (st.mode === 'celebrate' && st.modeT > 2.1) kickoff(st, st.choreo.play.side === 'h' ? 'a' : 'h');
  // ambient possession passing
  if (st.mode === 'open') {
    st.passT -= dt;
    if (st.holder && st.passT <= 0) {
      const mates = st.ps.filter(p => p.side === st.poss && p !== st.holder && p.pos !== 'GK');
      const sgn = atkSgn(st.poss);
      mates.sort((a, b) => (b.g.position.x * sgn + Math.random() * 30) - (a.g.position.x * sgn + Math.random() * 30));
      passBall(st, mates[Math.floor(Math.random() * Math.min(4, mates.length))]);
      st.passT = 0.55 + Math.random() * 0.5;

    }
  }
  // attack choreography
  if (st.mode === 'attack' && st.choreo) {
    const c = st.choreo, sgn = atkSgn(c.play.side);
    c.t += dt;
    if (c.stage === 'carry' && st.holder === c.shooter) {
      c.shooter.tx = sgn * 41; c.shooter.tz = Math.max(-12, Math.min(12, c.shooter.g.position.z * 0.5));
      if (Math.abs(c.shooter.g.position.x - sgn * 41) < 2.5 || c.t > 2.6) {
        c.stage = 'shot';
        c.shooter.kickT = 0.35;
        const out = c.play.out;
        const gz = out === 'miss' ? (Math.random() < 0.5 ? -1 : 1) * (4.4 + Math.random() * 2) : (Math.random() * 5 - 2.5);
        // keeper reads the shot (or guesses wrong on goals)
        const gk = st.ps.find(p => p.side !== c.play.side && p.pos === 'GK');
        if (gk) { gk.diveT = 0.6; gk.diveDir = out === 'save' ? (Math.sign(gz - gk.g.position.z) || 1) : (Math.random() < 0.5 ? 1 : -1); }
        st.flight = { fx: st.ball.position.x, fz: st.ball.position.z, tx: sgn * 53.2, tz: gz, t: 0, dur: 0.55, arc: out === 'miss' ? 2.2 : 1.1, shot: out };

    st.ball.position.x = fl.fx + (fl.tx - fl.fx) * k;
    st.ball.position.z = fl.fz + (fl.tz - fl.fz) * k;
    st.ball.position.y = 0.42 + Math.sin(k * Math.PI) * fl.arc;

        if (shot === 'goal') {
          if (c.play.side === 'h') st.hg++; else st.ag++;
          $('scorebar').innerHTML = scorebarHTML(st.f, st.hg, st.ag);
          flashGoal(); AU.goal();
          st.shake = 0.9;
          confetti(st, sgn * 48, 0);
          for (const m of M3.crowdMats) m.color.setScalar(1.8);
          st.mode = 'celebrate'; st.modeT = 0;
          st.camGoal = c.shooter;
          c.shooter.tx = sgn * 44; c.shooter.tz = c.shooter.g.position.z > 0 ? 22 : -22; // run to the corner
          for (const p of st.ps) if (p.side === c.play.side && p !== c.shooter && Math.random() < 0.6) { p.tx = c.shooter.tx - sgn * 2 + Math.random() * 4 - 2; p.tz = c.shooter.tz + Math.random() * 6 - 3; }
        } else {
          const gk = st.ps.find(p => p.side !== c.play.side && p.pos === 'GK');
          st.holder = gk; st.poss = gk.side; st.mode = 'open'; st.modeT = 0;
          if (shot === 'save') AU.swell(0.12, 1);
          st.choreo = null;
        }
      } else if (fl.to) st.holder = fl.to;
    }
  } else if (st.holder) {
    const h = st.holder.g;
    st.ball.position.set(h.position.x + Math.sin(h.rotation.y) * 0.75, 0.42, h.position.z + Math.cos(h.rotation.y) * 0.75);
  }
  // ball spin from travel
  st.ball.rotation.x += (st.ball.position.z - st.prevB.z) * 2.4;
  st.ball.rotation.z -= (st.ball.position.x - st.prevB.x) * 2.4;
  st.prevB.x = st.ball.position.x; st.prevB.z = st.ball.position.z;
  // players: drift, chase shape, animate
  const bx = st.ball.position.x, bz = st.ball.position.z;
  for (const p of st.ps) {
    if (st.mode !== 'celebrate' && p !== (st.choreo && st.choreo.shooter)) {
      const shift = p.pos === 'GK' ? 0 : 0.22;
      p.tx = p.ax + bx * shift + Math.sin(p.runPh * 0.11) * 1.2;
      p.tz = p.az + bz * (p.pos === 'GK' ? 0.12 : 0.18) + Math.cos(p.runPh * 0.09) * 1.2;
    }
    const dx = p.tx - p.g.position.x, dz = p.tz - p.g.position.z;
    const d = Math.hypot(dx, dz);
    const moving = d > 0.12 && p.diveT <= 0;
    if (moving) {
      const step = Math.min(d, p.spd * dt * (st.mode === 'celebrate' ? 1.5 : 1));
      p.g.position.x += dx / d * step;
      p.g.position.z += dz / d * step;
      p.g.rotation.y = Math.atan2(dx, dz);
    }
    m3Anim(p, dt, moving, p.spd);
  }
  // fx: confetti fall + crowd pulse decay
  for (const fx of st.fx.slice()) {
    fx.t += dt;
    const pos = fx.pts.geometry.attributes.position;
    for (let i = 0; i < fx.vel.length; i++) {
      pos.array[i * 3] += fx.vel[i][0] * dt;
      pos.array[i * 3 + 1] += fx.vel[i][1] * dt;
      pos.array[i * 3 + 2] += fx.vel[i][2] * dt;
    }
    pos.needsUpdate = true;
    fx.pts.material.opacity = Math.max(0, 1 - fx.t / 2.4);
    if (fx.t > 2.4) { M3.scene.remove(fx.pts); fx.pts.geometry.dispose(); fx.pts.material.dispose(); st.fx.splice(st.fx.indexOf(fx), 1); }
  }
  for (const m of M3.crowdMats) if (m.color.r > 1) m.color.setScalar(Math.max(1, m.color.r - dt * 0.8));

  if (st.mode === 'celebrate' && st.camGoal) {
    const s = st.camGoal.g.position;
    M3.cam.position.lerp(new THREE.Vector3(s.x * 0.82, 4.5, s.z + 13), Math.min(1, dt * 3));

    const cx = Math.max(-26, Math.min(26, bx * 0.8));
    M3.cam.position.lerp(new THREE.Vector3(cx, 25, 45), Math.min(1, dt * 2.2));
    M3.cam.lookAt(bx * 0.85, 0.5, bz * 0.45);
  }
  if (st.shake > 0.01) {
    M3.cam.position.x += (Math.random() - 0.5) * st.shake;
    M3.cam.position.y += (Math.random() - 0.5) * st.shake * 0.5;
    st.shake *= Math.pow(0.01, dt);
  }
  M3.R.render(M3.scene, M3.cam);
}

const dPower = c => { const t = c.p.map(r => r[4]).sort((a, b) => b - a).slice(0, 18); return t.reduce((s, v) => s + v, 0) / Math.max(1, t.length); };
function pickLeague(li) {
  const clubs = DATA.clubs.map((c, i) => ({ c, i })).filter(x => x.c.lg === li).sort((a, b) => dPower(b.c) - dPower(a.c));

}
function openClubProfile(i) {
  const c = DATA.clubs[i], L = DATA.leagues[c.lg];

  const stars = pw >= 82 ? '★★★★★' : pw >= 79 ? '★★★★½' : pw >= 76 ? '★★★★' : pw >= 72 ? '★★★½' : pw >= 68 ? '★★★' : '★★½';

  const n = DATA.clubs.filter(x => x.lg === c.lg).length;
  const expect = L.level === 2 ? (rank <= 4 ? 'Win promotion' : 'Finish in the top half')

function initTactics() {
  const board = $('tboard'); if (!board) return;
  let active = null, moved = false, sx = 0, sy = 0;
  board.querySelectorAll('.tok').forEach(tok => {
    tok.addEventListener('pointerdown', e => {
      active = tok; moved = false; sx = e.clientX; sy = e.clientY;
      tok.classList.add('drag'); tok.setPointerCapture(e.pointerId); e.preventDefault();
    });
    tok.addEventListener('pointermove', e => {
      if (active !== tok) return;
      if (Math.abs(e.clientX - sx) > 4 || Math.abs(e.clientY - sy) > 4) moved = true;
      const r = board.getBoundingClientRect();
      const x = clamp(((e.clientX - r.left) / r.width) * 100, 4, 96);
      const y = clamp(((e.clientY - r.top) / r.height) * 100, 4, 96);
      tok.style.left = x + '%'; tok.style.top = y + '%';
      const i = +tok.dataset.idx; me().shape[i].x = x; me().shape[i].y = y;
    });
    const up = () => {
      if (active !== tok) return;
      tok.classList.remove('drag');
      if (moved) { $('tfeedback').innerHTML = tacFeedback(me()); autosave(); }
      else openRoleEditor(+tok.dataset.idx);
      active = null;
    };
    tok.addEventListener('pointerup', up);
    tok.addEventListener('pointercancel', up);
  });
}

function doContinue() {
  for (let i = 0; i < 500; i++) {
    const ev = ENG.advanceDay(G);
    if (ev === 'match') return prepMatch();
    if (ev === 'seasonEnd') return endSeasonUI();
    if (ev === 'offer') {
      const { cid, pid, fee } = G.pendingOffer;
      const buyer = G.clubs[cid], p = me().players.find(p => p.id === pid);
      if (p && confirm(`💰 ${buyer.n} (${DATA.leagues[buyer.lg].flag} ${DATA.leagues[buyer.lg].name}) bid ${money(fee)} for ${p.name} (value ${money(p.value)}). Accept?`)) {
        ENG.acceptOffer(G);
      } else G.pendingOffer = null;
    }
  }
}

  const oppStar = opp.players.slice().sort((a, b) => b.ovr - a.ovr)[0];
  const xi = ENG.bestXI(me());
  $('match-pre').style.display = 'block';
  $('match-live').style.display = 'none';
  $('match-post').innerHTML = '';
  $('match-pre').innerHTML = `<div class="card"><div class="in" style="text-align:center">
    <span class="eyebrow">Match day · ${esc(compLabel(f))} · ${fdate(G.time)}</span>
    <div class="row" style="justify-content:center;gap:30px;margin:16px 0">
      <div>${logo(G.clubs[f.h], 84)}<h3>${esc(G.clubs[f.h].n)}</h3></div>
      <h2 class="mega" style="font-size:44px;color:var(--volt)">VS</h2>
      <div>${logo(G.clubs[f.a], 84)}<h3>${esc(G.clubs[f.a].n)}</h3></div>
    </div>
    <p class="muted">Opponent squad ${Math.round(ENG.power(opp))} OVR (${esc(opp.formation)} · ${esc(opp.buildUp || 'balanced')}) · danger man: <b style="color:var(--txt)">${esc(oppStar.name)} (${oppStar.ovr})</b> · you are ${home ? 'HOME' : 'AWAY'}</p>
    <h3 style="margin-top:16px">Your XI — ${me().formation} · ${me().buildUp} · ${me().defApproach} line</h3>
    ${pitchHTML(me(), xi)}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="primary" style="font-size:21px;padding:13px 38px" onclick="playMatch()">Kick off ▶</button></div>
  </div></div>`;
  $('h-date').textContent = fdate(G.time);
  stinger(f, null);
  show('match');
}

let matchRes = null, liveMin = 0, shownEv = 0;
function scorebarHTML(f, h, a) {
  return `<span class="tm">${logo(G.clubs[f.h], 38)} ${esc(G.clubs[f.h].s)}</span>
    <span class="sc">${h} – ${a}</span>
    <span class="tm">${esc(G.clubs[f.a].s)} ${logo(G.clubs[f.a], 38)}</span>`;
}
function flashGoal() {
  $('goalbanner').classList.remove('show');
  void $('goalbanner').offsetWidth;
  $('goalbanner').classList.add('show');
  setTimeout(() => $('goalbanner').classList.remove('show'), 1400);
}
function playMatch() {
  matchRes = ENG.playDay(G);
  autosave();
  const f = matchRes.user.f;
  $('match-pre').style.display = 'none';
  $('match-live').style.display = 'block';
  $('match-comp').textContent = compLabel(f);
  $('ticker').innerHTML = `<div class="muted">${fdate(G.time)} — we're underway!</div>`;
  $('scorebar').innerHTML = scorebarHTML(f, 0, 0);
  $('minute').textContent = "1'";
  if (!m3Start(matchRes.user)) { // no WebGL → text ticker fallback
    $('stage').style.display = 'none';
    liveMin = 0; shownEv = 0;
    tickerTimer = setInterval(() => {
      liveMin++;
      if (liveMin > 90) return finishTicker();
      $('minute').textContent = liveMin + "'";
      const evs = matchRes.user.ev;
      let sb = null;
      while (shownEv < evs.length && evs[shownEv].min <= liveMin) {
        const e = evs[shownEv++];
        $('ticker').innerHTML += `<div class="${e.goal ? 'goal' : ''}">${esc(e.txt)}</div>`;
        $('ticker').scrollTop = 1e6;
        if (e.goal) sb = e.score;
      }
      if (sb) { const [h, a] = sb.split('-').map(Number); $('scorebar').innerHTML = scorebarHTML(f, h, a); flashGoal(); }
    }, 70);
  } else $('stage').style.display = 'block';
}
function skipTicker() { finishTicker(); }
function finishTicker() {
  clearInterval(tickerTimer);
  m3Stop();
  $('goalbanner').classList.remove('show');
  if (!matchRes || $('match-post').innerHTML) return;
  const u = matchRes.user, f = u.f, st = u.stats;
  $('match-live').style.display = 'none';
  const won = (f.h === G.userClub && f.hg > f.ag) || (f.a === G.userClub && f.ag > f.hg);
  const drew = f.hg === f.ag;
  G.rep = Math.max(0, Math.min(100, G.rep + (won ? 1 : drew ? 0 : -1)));
  const myRatings = u.ratings.filter(r => r.club === G.userClub).sort((a, b) => b.r - a.r);
  const motm = u.ratings.slice().sort((a, b) => b.r - a.r)[0];
  const sameComp = matchRes.others.filter(o => o.c === f.c);
  const bar = (hv, av, lbl, hc, ac) => `<div class="statbar"><span>${hv}</span>
    <div class="bar" style="justify-content:flex-end"><i style="width:${Math.round(100 * hv / Math.max(1, hv + av))}%;background:${hc}"></i></div>
    <span class="lbl">${lbl}</span>
    <div class="bar"><i style="width:${Math.round(100 * av / Math.max(1, hv + av))}%;background:${ac}"></i></div><span style="text-align:right">${av}</span></div>`;
  $('match-post').innerHTML = `<div class="card"><div class="in" style="text-align:center">
    <span class="eyebrow">Full time · ${esc(compLabel(f))}</span>
    <div class="scorebar" style="margin:12px 0">${scorebarHTML(f, f.hg, f.ag)}</div>
    <p class="muted">${[...u.scorers.h, ...u.scorers.a].map(esc).join(' · ') || 'No goals.'} ${won ? '🎉' : drew ? '' : '😞'}</p>
    <div style="max-width:580px;margin:16px auto">
      ${bar(st.h.poss, st.a.poss, 'Possession %', G.clubs[f.h].c1, G.clubs[f.a].c1)}
      ${bar(st.h.shots, st.a.shots, 'Shots', G.clubs[f.h].c1, G.clubs[f.a].c1)}
      ${bar(st.h.sot, st.a.sot, 'On target', G.clubs[f.h].c1, G.clubs[f.a].c1)}
    </div>
    <h3>⭐ Man of the Match</h3>
    <div class="row" style="justify-content:center">${face(motm, 56)}<div style="text-align:left"><b>${esc(motm.name)}</b><br>${ovrChip(motm.ovr)} <b style="color:var(--volt)">${motm.r.toFixed(1)}</b></div></div>
    <h3 style="margin-top:16px">Your player ratings</h3>
    <table class="grid" style="max-width:490px;margin:0 auto">${myRatings.map(r => `<tr><td>${face(r, 26)}</td><td class="pos-${r.pos}">${r.pos}</td><td style="text-align:left"><b>${esc(r.name)}</b></td><td><b style="color:${r.r >= 7.5 ? 'var(--volt)' : r.r < 6 ? '#ff6b6b' : 'inherit'}">${r.r.toFixed(1)}</b></td></tr>`).join('')}</table>
    ${sameComp.length ? `<h3 style="margin-top:16px">Elsewhere</h3><table class="grid" style="max-width:490px;margin:0 auto">${sameComp.slice(0, 12).map(o => `<tr><td style="text-align:right">${esc(G.clubs[o.h].s)} ${logo(G.clubs[o.h], 20)}</td><td style="text-align:center"><b>${o.hg}–${o.ag}</b></td><td>${logo(G.clubs[o.a], 20)} ${esc(G.clubs[o.a].s)}</td></tr>`).join('')}</table>` : ''}
    <div class="row" style="justify-content:center;margin-top:16px"><button class="primary" onclick="tab='table';enterHub()">Continue ▶</button></div>
  </div></div>`;
}

// ---------- season end ----------
function acceptJobUI(id) {
  ENG.acceptJob(G, id);
  autosave();
  closeModal();
  enterHub();
}
function endSeasonUI() {
  const s = ENG.endSeason(G);
  autosave();
  enterHub();
  const offer = s.jobOffer != null ? G.clubs[s.jobOffer] : null;
  $('modal').innerHTML = `<h2>🏆 Season ${G.season - 1} Complete</h2>
    <p>You finished <b>${s.userPos}${['st', 'nd', 'rd'][s.userPos - 1] || 'th'}</b> and earned ${money(s.prize)}.</p>
    <div class="card flat"><b>BOARD VERDICT</b><br>Objective: ${esc(s.board.txt)} — ${s.board.met ? '<span class="green">✅ Achieved. The board is delighted.</span>' : '<span class="red">❌ Missed. The board expects better.</span>'}</div>
    <div class="card flat" style="margin-top:10px"><b>CHAMPIONS</b><br>${s.champions.map(esc).join('<br>')}</div>
    <div class="card flat" style="margin-top:10px"><b>UP & DOWN</b><br>${s.proms.map(esc).join('<br>')}</div>
    <div class="card flat" style="margin-top:10px"><b>${esc(myLeague().name).toUpperCase()} AWARDS</b><br>
    ⚽ Golden Boot: <b>${esc(s.awards.topScorer.name)}</b> (${esc(s.awards.topScorer.club)}) — ${s.awards.topScorer.goals} goals<br>
    🌟 Player of the Season: <b>${esc(s.awards.bestPlayer.name)}</b> (${esc(s.awards.bestPlayer.club)})<br>
    🌱 Best Young Player: <b>${esc(s.awards.bestYoung.name)}</b> (${esc(s.awards.bestYoung.club)}, ${s.awards.bestYoung.age})</div>
    ${offer ? `<div class="card flat" style="margin-top:10px;border:1px solid var(--volt)"><b>📞 MANAGER MARKET</b><br>
      ${logo(offer, 24)} <b>${esc(offer.n)}</b> (${DATA.leagues[offer.lg].flag} ${esc(DATA.leagues[offer.lg].name)}) want you as their new manager.<br>
      <div class="row" style="margin-top:8px"><button onclick="acceptJobUI(${offer.id})">Join ${esc(offer.n)}</button></div></div>` : ''}
    <p class="muted" style="margin-top:10px">Players aged, contracts ticked down, youth prospects arrived. Season ${G.season} starts in July.</p>
    <div class="row" style="margin-top:8px"><button class="primary" onclick="closeModal()">Stay at ${esc(me().n)} ▶</button></div>`;
  $('modal-bg').classList.add('on');
}

// ---------- boot ----------
(function boot() {
  const want = ['K. Mbappé', 'E. Haaland', 'Lamine Yamal', 'M. Salah', 'V. Osimhen'];
  const faces = [];
  for (const c of DATA.clubs) for (const row of c.p) if (want.includes(row[0]) && row[15]) faces.push(row[15]);
  $('menu-faces').innerHTML = faces.slice(0, 5).map(f => `<img loading="lazy" src="https://cdn.sofifa.net/players/${f}/26_240.png" onerror="this.remove()">`).join('');
  $('src').textContent = 'Data: ' + DATA.source;
  renderSlots();
  setTimeout(() => $('splash').classList.add('off'), 1200);
})();
</script>
</body>
</html>
