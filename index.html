<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locking In FC — Career Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --c1:#c8102e; --c2:#ffffff; --bg:#0a0e14; --panel:#121824; --panel2:#0d1320; --line:#1f2836; --txt:#e8ecf3; --mut:#8b95a8; --acc:#c7f000; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Barlow',system-ui,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh;
    background-image:linear-gradient(115deg, color-mix(in srgb, var(--c1) 22%, transparent) 0%, transparent 42%),
                     linear-gradient(295deg, color-mix(in srgb, var(--c1) 10%, transparent) 0%, transparent 30%); background-attachment:fixed; }
  h1,h2,h3,.disp { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.5px; }
  h2 { font-size:26px; } h3 { font-size:19px; color:#fff; margin:6px 0; }
  button { font:inherit; cursor:pointer; border:0; border-radius:4px; padding:8px 14px; background:#232c3d; color:var(--txt); font-weight:600; }
  button:hover { filter:brightness(1.25); }
  button.primary { background:linear-gradient(100deg, var(--c1), color-mix(in srgb, var(--c1) 60%, #000)); color:var(--c2);
    font-family:'Barlow Condensed'; text-transform:uppercase; font-weight:800; font-size:17px; letter-spacing:1px; padding:9px 22px;
    clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); border-radius:0; }
  input, select { font:inherit; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:8px; }
  .screen { display:none; max-width:1120px; margin:0 auto; padding:16px; }
  .screen.on { display:block; }
  .card { background:linear-gradient(180deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:8px; padding:16px; margin:12px 0;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--mut); font-size:13px; }
  table.grid { width:100%; border-collapse:collapse; font-size:14.5px; }
  table.grid th, table.grid td { padding:7px 8px; text-align:left; border-bottom:1px solid var(--line); }
  table.grid th { color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:13px; letter-spacing:1px; }
  table.grid tr.click:hover { background:#1a2334; cursor:pointer; }
  table.grid tr.me { background:color-mix(in srgb, var(--c1) 14%, transparent); border-left:3px solid var(--c1); }
  .face { width:30px; height:30px; border-radius:50%; object-fit:cover; background:#1c2534; vertical-align:middle; }
  .logo { object-fit:contain; vertical-align:middle; }
  .ovr { display:inline-block; min-width:30px; text-align:center; font-family:'Barlow Condensed'; font-weight:800; font-size:16px; border-radius:4px; padding:1px 4px; color:#141414; }
  .t-gold { background:linear-gradient(160deg,#f5d87c,#c9a33c); } .t-silver { background:linear-gradient(160deg,#d8dee8,#98a1b0); } .t-bronze { background:linear-gradient(160deg,#d0a06c,#96683c); }
  header#top { display:flex; align-items:center; gap:14px; padding:10px 18px; background:linear-gradient(90deg,var(--panel) 60%, color-mix(in srgb, var(--c1) 25%, var(--panel))); border-bottom:3px solid var(--c1); position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header#top .grow { flex:1; }
  #h-club { font-family:'Barlow Condensed'; font-size:22px; font-weight:800; text-transform:uppercase; letter-spacing:1px; }
  nav { display:flex; gap:2px; margin:14px 0 10px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  nav button { background:none; border-radius:0; color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:16px; letter-spacing:1px; padding:10px 16px; border-bottom:3px solid transparent; }
  nav button.act { color:#fff; border-bottom-color:var(--c1); }
  .clubcard { background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:8px; padding:16px; cursor:pointer; width:215px; text-align:center;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); }
  .clubcard:hover { border-color:var(--c1); transform:translateY(-2px); transition:.15s; }
  .groups { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; }
  #modal-bg { display:none; position:fixed; inset:0; background:#000c; z-index:10; align-items:center; justify-content:center; }
  #modal-bg.on { display:flex; }
  #modal { background:var(--panel); border-radius:10px; padding:20px; max-width:600px; width:94%; max-height:88vh; overflow:auto; border-top:4px solid var(--c1); }
  /* FUT card */
  .fut { width:230px; margin:0 auto; padding:18px 14px 12px; text-align:center; border-radius:12px; color:#1c1508; position:relative;
    clip-path:polygon(0 6%,50% 0,100% 6%,100% 94%,50% 100%,0 94%); }
  .fut.t-gold { background:linear-gradient(165deg,#f8e7a9 0%,#e9c95c 45%,#b8912e 100%); }
  .fut.t-silver { background:linear-gradient(165deg,#eef1f6 0%,#c3cbd8 45%,#8b95a6 100%); }
  .fut.t-bronze { background:linear-gradient(165deg,#e8c39a 0%,#c99a64 45%,#8a5f33 100%); }
  .fut .big { position:absolute; left:16px; top:16px; text-align:center; font-family:'Barlow Condensed'; line-height:.95; }
  .fut .big b { font-size:40px; display:block; }
  .fut img.pface { width:110px; height:110px; object-fit:cover; }
  .fut .pname { font-family:'Barlow Condensed'; font-weight:800; font-size:22px; text-transform:uppercase; border-top:2px solid #00000030; border-bottom:2px solid #00000030; margin:4px 8px; padding:2px 0; }
  .fut .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 8px; font-size:14px; padding:4px 12px 0; }
  .fut .stats b { font-size:17px; }
  /* pitch */
  .pitch { position:relative; width:min(430px,94vw); aspect-ratio:3/3.6; margin:8px auto; border:2px solid #ffffff40; border-radius:6px;
    background:repeating-linear-gradient(0deg,#12752f 0 11%,#0f6829 11% 22%); overflow:hidden; }
  .pitch::before { content:''; position:absolute; left:50%; top:-9%; width:34%; aspect-ratio:1; border:2px solid #ffffff40; border-radius:50%; transform:translateX(-50%); }
  .pitch::after { content:''; position:absolute; left:25%; bottom:0; width:50%; height:14%; border:2px solid #ffffff40; border-bottom:0; }
  .chip { position:absolute; transform:translate(-50%,-50%); text-align:center; width:74px; }
  .chip img { width:38px; height:38px; border-radius:50%; background:#0d1320cc; border:2px solid #ffffffb0; object-fit:cover; }
  .chip .nm { font-size:11px; font-weight:600; background:#0d1320d8; border-radius:3px; padding:1px 3px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* match */
  .scorebar { display:flex; align-items:center; justify-content:center; gap:16px; background:linear-gradient(90deg,var(--panel2),var(--panel),var(--panel2)); border:1px solid var(--line); border-radius:8px; padding:12px 18px; }
  .scorebar .sc { font-family:'Barlow Condensed'; font-size:46px; font-weight:800; min-width:110px; text-align:center; }
  .scorebar .tm { font-family:'Barlow Condensed'; font-size:24px; font-weight:700; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  #minute { font-family:'Barlow Condensed'; font-size:20px; font-weight:700; color:var(--acc); text-align:center; margin-top:4px; }
  #ticker { background:#070a10; border:1px solid var(--line); border-radius:8px; padding:12px; height:280px; overflow-y:auto; font-size:14.5px; line-height:1.8; margin-top:10px; }
  #ticker .goal { color:var(--acc); font-weight:700; }
  .statbar { display:grid; grid-template-columns:56px 1fr 130px 1fr 56px; gap:8px; align-items:center; margin:6px 0; font-weight:600; }
  .statbar .lbl { text-align:center; color:var(--mut); font-family:'Barlow Condensed'; text-transform:uppercase; font-size:13px; letter-spacing:1px; }
  .statbar .bar { height:8px; border-radius:4px; background:#232c3d; overflow:hidden; display:flex; }
  .statbar .bar i { display:block; height:100%; }
  .inj { color:#ff6b6b; } .pos-GK{color:#f2c14e} .pos-DF{color:#6bb3ff} .pos-MF{color:#7ee08a} .pos-AT{color:#ff8f6b}
  .green { color:#7ee08a; } .red { color:#ff6b6b; }
  #menu { text-align:center; padding-top:7vh; }
  #menu h1 { font-size:56px; font-weight:800; background:linear-gradient(90deg,#fff,#9fb0c8); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menu .card { max-width:460px; margin:14px auto; text-align:left; }
</style>
</head>
<body>

<header id="top" style="display:none">
  <span id="h-logo"></span>
  <div><span id="h-club"></span><div class="muted" id="h-mgr"></div></div>
  <div class="grow"></div>
  <div style="text-align:right"><b id="h-date" class="disp" style="font-size:18px"></b><div class="muted" id="h-money"></div></div>
  <button onclick="saveGame()">💾 Save</button>
  <button onclick="toMenu()">Menu</button>
  <button class="primary" id="h-cont" onclick="doContinue()">Continue ▶</button>
</header>

<div id="menu" class="screen on">
  <h1>Locking In FC</h1>
  <p class="muted">CAREER MODE · real clubs · real players · real ratings<br><span id="src"></span></p>
  <div class="card">
    <h3>New Career</h3>
    <div class="row"><input id="mgr-name" placeholder="Your manager name" value="The Boss">
    <button class="primary" onclick="toPick()">Start ▶</button></div>
  </div>
  <div class="card"><h3>Load Career</h3><div id="slots"></div></div>
</div>

<div id="pick" class="screen">
  <h2>Choose a league</h2>
  <div class="row" id="leaguelist"></div>
  <div id="clubpick"></div>
</div>

<div id="hub" class="screen">
  <nav id="tabs"></nav>
  <div id="tabbody"></div>
</div>

<div id="match" class="screen">
  <div id="match-pre"></div>
  <div id="match-live" style="display:none">
    <p class="muted" id="match-comp" style="text-align:center;margin-top:8px"></p>
    <div class="scorebar" id="scorebar"></div>
    <div id="minute"></div>
    <div id="ticker"></div>
    <div class="row" style="margin-top:10px;justify-content:center"><button onclick="skipTicker()">⏩ Skip to full time</button></div>
  </div>
  <div id="match-post" style="display:none"></div>
</div>

<div id="modal-bg" onclick="if(event.target===this)closeModal()"><div id="modal"></div></div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
let G = null, tab = 'squad', tickerTimer = null;

const $ = id => document.getElementById(id);
const money = n => (n < 0 ? '-' : '') + (Math.abs(n) >= 1e6 ? '€' + (Math.abs(n) / 1e6).toFixed(1) + 'M' : '€' + Math.round(Math.abs(n) / 1e3) + 'k');
const fdate = t => new Date(t).toUTCString().slice(0, 16);
const me = () => G.clubs[G.userClub];
const myLeague = () => DATA.leagues[me().lg];
const show = id => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('on')); $(id).classList.add('on'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const FACE0 = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#1c2534"/><circle cx="20" cy="15" r="7" fill="#46536b"/><ellipse cx="20" cy="34" rx="12" ry="9" fill="#46536b"/></svg>');
const SHIELD0 = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M20 2 36 8v12c0 10-7 16-16 18C11 36 4 30 4 20V8z" fill="#2a3547" stroke="#46536b"/></svg>');
const face = (p, sz = 30) => `<img class="face" style="width:${sz}px;height:${sz}px" loading="lazy" src="${p.img ? 'https://cdn.sofifa.net/players/' + p.img + '/26_120.png' : FACE0}" onerror="this.onerror=null;this.src=FACE0">`;
function logo(c, sz = 24) {
  return c.t ? `<img class="logo" style="width:${sz}px;height:${sz}px" loading="lazy" src="https://cdn.sofifa.net/meta/team/${c.t}/120.png" onerror="logoFail(this,${c.t})">`
    : `<img class="logo" style="width:${sz}px;height:${sz}px" src="${SHIELD0}">`;
}
function logoFail(el, t) {
  if (el.dataset.s) { el.onerror = null; el.src = SHIELD0; }
  else { el.dataset.s = 1; el.src = 'https://cdn.sofifa.net/teams/' + t + '/120.png'; }
}
const tier = ovr => ovr >= 75 ? 't-gold' : ovr >= 65 ? 't-silver' : 't-bronze';
const ovrChip = ovr => `<span class="ovr ${tier(ovr)}">${ovr}</span>`;

function theme(c) { document.documentElement.style.setProperty('--c1', c.c1); document.documentElement.style.setProperty('--c2', c.c2); }
function compLabel(f) {
  if (f.c[0] === 'L') return DATA.leagues[+f.c.slice(1)].name + ' · Round ' + f.r;
  if (f.c === 'UCLg') return 'Champions League · Group ' + 'ABCDEFGH'[f.g] + ' · MD' + f.r;
  if (f.c === 'UELg') return 'Europa League · Group ' + 'ABCDEFGH'[f.g] + ' · MD' + f.r;
  return (G.knock[f.c] ? G.knock[f.c].name : f.c) + ' · ' + (f.stage || '');
}

// ---------- save / load ----------
const slotKey = i => 'fcm_slot_' + i;
function renderSlots() {
  let html = '';
  for (const i of [1, 2, 3, 'auto']) {
    const raw = localStorage.getItem(slotKey(i));
    if (raw) {
      const s = JSON.parse(raw);
      html += `<div class="row" style="margin:6px 0"><button class="primary" onclick="loadGame('${i}')">Load</button>
        <span>${i === 'auto' ? '🔄 Autosave' : 'Slot ' + i}: ${esc(s.managerName)} — ${esc(s.clubs[s.userClub].n)}, Season ${s.season}</span>
        <button onclick="localStorage.removeItem('${slotKey(i)}');renderSlots()">🗑</button></div>`;
    } else if (i !== 'auto') html += `<div class="row muted" style="margin:6px 0">Slot ${i}: empty</div>`;
  }
  $('slots').innerHTML = html || '<span class="muted">No saves yet.</span>';
}
function saveGame() {
  const i = prompt('Save to slot (1, 2 or 3):', '1');
  if (!['1', '2', '3'].includes(i)) return;
  try { localStorage.setItem(slotKey(i), JSON.stringify(G)); alert('Saved to slot ' + i); }
  catch (e) { alert('Storage full — delete another save slot first (browser limit).'); }
}
function autosave() { try { localStorage.setItem(slotKey('auto'), JSON.stringify(G)); } catch (e) {} }
function loadGame(i) { G = JSON.parse(localStorage.getItem(slotKey(i))); enterHub(); }
function toMenu() { renderSlots(); show('menu'); $('top').style.display = 'none'; }

// ---------- club pick ----------
function toPick() {
  $('leaguelist').innerHTML = DATA.leagues.map((L, li) => L.play ?
    `<button onclick="pickLeague(${li})" style="font-size:15px">${L.flag} ${esc(L.name)}</button>` : '').join('');
  $('clubpick').innerHTML = '<p class="muted" style="margin-top:14px">Manage in any of the 11 leagues above. The Saudi Pro League, MLS and Süper Lig live in the game world too — they play, buy and sell (and they will come for your stars).</p>';
  show('pick');
}
function pickLeague(li) {
  const tmp = ENG.newGame('x', 0);
  const clubs = ENG.leagueClubs(tmp, li).sort((a, b) => ENG.power(b) - ENG.power(a));
  $('clubpick').innerHTML = `<h3 style="margin-top:14px">${DATA.leagues[li].flag} ${esc(DATA.leagues[li].name)}</h3><div class="row">` +
    clubs.map(c => `<div class="clubcard" onclick="startGame(${c.id})">${logo(c, 56)}<h3>${esc(c.n)}</h3>
      <div>${ovrChip(Math.round(ENG.power(c)))} <span class="muted">Budget ${money(c.budget)}</span></div></div>`).join('') + '</div>';
}
function startGame(clubId) {
  G = ENG.newGame($('mgr-name').value.trim() || 'The Boss', clubId);
  enterHub();
}
function enterHub() {
  theme(me());
  $('top').style.display = 'flex';
  if (!Object.keys(TABS).includes(tab)) tab = 'squad';
  renderHub();
  show('hub');
}

// ---------- hub ----------
const TABS = { squad: 'Squad', table: 'Table', cups: 'Cups & Europe', fixtures: 'Fixtures', market: 'Transfers', finance: 'Finances', club: 'Club' };
function renderHub() {
  const c = me();
  $('h-logo').innerHTML = logo(c, 40);
  $('h-club').textContent = c.n;
  $('h-mgr').textContent = `${myLeague().flag} ${myLeague().name} · ${G.managerName} · Rep ${G.rep} · Season ${G.season}`;
  $('h-date').textContent = fdate(G.time);
  $('h-money').textContent = `Budget ${money(c.budget)} · Wages ${money(ENG.wageBill(c))}/wk` + (ENG.windowOpen(G) ? ' · 🟢 window open' : '');
  $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) =>
    `<button class="${tab === k ? 'act' : ''}" onclick="tab='${k}';renderHub()">${v}</button>`).join('');
  $('tabbody').innerHTML = ({ squad: rSquad, table: rTable, cups: rCups, fixtures: rFixtures, market: rMarket, finance: rFinance, club: rClub })[tab]();
}

const posOrder = { GK: 0, DF: 1, MF: 2, AT: 3 };
function playerRow(p, ownerId, showClub) {
  const c = G.clubs[ownerId];
  return `<tr class="click" onclick="openPlayer(${p.id},${ownerId})">
    <td>${face(p)}</td><td class="pos-${p.pos}">${p.pos}</td>
    <td><b>${esc(p.name)}</b> ${p.listed ? '🏷' : ''}${p.youth ? '🌱' : ''}${p.injury ? `<span class="inj"> 🩹${p.injury}d</span>` : ''}</td>
    <td>${p.age}</td><td>${ovrChip(p.ovr)}</td><td>${p.fit}%</td><td>${p.sg}/${p.sa}</td>
    <td>${money(p.value)}</td><td>${showClub ? logo(c, 20) + ' ' + esc(c.s) : money(p.wage) + '/wk · ' + p.years + 'y'}</td></tr>`;
}
function rSquad() {
  const ps = me().players.slice().sort((a, b) => posOrder[a.pos] - posOrder[b.pos] || b.ovr - a.ovr);
  const xi = ENG.bestXI(me()).map(p => p.id);
  return `<div class="card"><h3>Squad (${ps.length}) — starting XI marked <b style="color:var(--c1)">▮</b></h3>
    <table class="grid"><tr><th></th><th>Pos</th><th>Name</th><th>Age</th><th>OVR</th><th>Fit</th><th>G/A</th><th>Value</th><th>Contract</th></tr>
    ${ps.map(p => playerRow(p, G.userClub).replace('<tr class="click"', xi.includes(p.id) ? '<tr class="click" style="border-left:3px solid var(--c1)"' : '<tr class="click"')).join('')}</table></div>`;
}
function rTable() {
  const li = window._tblLg ?? me().lg;
  const t = ENG.table(G, 'L' + li);
  const scorers = ENG.leagueClubs(G, li).flatMap(c => c.players.map(p => ({ p, c }))).sort((a, b) => b.p.sg - a.p.sg).slice(0, 8);
  return `<div class="card"><div class="row"><h3>League Table</h3>
    <select onchange="window._tblLg=+this.value;renderHub()">${DATA.leagues.map((L, i) => `<option value="${i}" ${i === li ? 'selected' : ''}>${L.flag} ${esc(L.name)}</option>`).join('')}</select></div>
    <table class="grid"><tr><th>#</th><th colspan="2">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
    ${t.map((r, i) => `<tr class="${r.id === G.userClub ? 'me' : ''}"><td>${i + 1}</td><td style="width:28px">${logo(G.clubs[r.id], 22)}</td><td><b>${esc(r.name)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf - r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('')}
    </table></div>
    <div class="card"><h3>Top Scorers <span class="muted">(all competitions)</span></h3>
    <table class="grid">${scorers.map(x => `<tr><td style="width:36px">${face(x.p)}</td><td><b>${esc(x.p.name)}</b></td><td>${logo(x.c, 20)} ${esc(x.c.s)}</td><td><b>${x.p.sg}</b> goals, ${x.p.sa} assists</td></tr>`).join('')}</table></div>`;
}
function rCups() {
  const myCup = 'C' + (DATA.leagues[me().lg].level === 2 ? DATA.leagues.findIndex(L => L.d2 === me().lg) : me().lg);
  const sel = window._cupSel || (G.knock[myCup] ? myCup : 'UCL');
  const opts = [...G.cupCountries.map(li => 'C' + li), 'UCL', 'UEL'];
  let html = `<div class="card"><div class="row"><h3>Competition</h3>
    <select onchange="window._cupSel=this.value;renderHub()">${opts.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${G.knock[k].flag} ${esc(G.knock[k].name)}</option>`).join('')}</select></div></div>`;
  if (sel === 'UCL' || sel === 'UEL') {
    html += `<div class="card"><h3>Group Stage</h3><div class="groups">` + G.groups[sel].map((grp, gi) =>
      `<div><b class="muted">GROUP ${'ABCDEFGH'[gi]}</b><table class="grid">` +
      ENG.table(G, sel + 'g', grp, gi).map(r => `<tr class="${r.id === G.userClub ? 'me' : ''}"><td style="width:26px">${logo(G.clubs[r.id], 20)}</td><td>${esc(r.short)}</td><td>${r.p}</td><td><b>${r.pts}</b></td></tr>`).join('') + '</table></div>').join('') + '</div></div>';
  }
  const ko = G.fixtures.filter(f => f.c === sel);
  if (ko.length) {
    const rounds = [...new Set(ko.map(f => f.r))];
    html += '<div class="card"><h3>Knockout</h3>' + rounds.map(r => {
      const fs = ko.filter(f => f.r === r);
      return `<b class="muted">${esc(fs[0].stage).toUpperCase()}</b><table class="grid">` + fs.map(f =>
        `<tr class="${f.h === G.userClub || f.a === G.userClub ? 'me' : ''}"><td style="text-align:right">${esc(G.clubs[f.h].n)} ${logo(G.clubs[f.h], 20)}</td>
        <td style="text-align:center">${f.pl ? `<b>${f.hg}–${f.ag}</b>${f.pen !== undefined ? '<div class="muted">(' + esc(G.clubs[f.pen].s) + ' on pens)</div>' : ''}` : '<span class="muted">' + fdate(f.t).slice(0, 11) + '</span>'}</td>
        <td>${logo(G.clubs[f.a], 20)} ${esc(G.clubs[f.a].n)}</td></tr>`).join('') + '</table>';
    }).join('') + '</div>';
  } else if (!(sel === 'UCL' || sel === 'UEL')) html += '<p class="muted">Draw not made yet.</p>';
  const K = G.knock[sel];
  if (K.alive && K.alive.length === 1) html += `<div class="card">🏆 ${logo(G.clubs[K.alive[0]], 28)} <b>${esc(G.clubs[K.alive[0]].n)}</b> are ${esc(K.name)} champions!</div>`;
  return html;
}
function rFixtures() {
  const mine = G.fixtures.filter(f => f.h === G.userClub || f.a === G.userClub).sort((a, b) => a.t - b.t);
  return `<div class="card"><h3>My Fixtures — Season ${G.season}</h3><table class="grid">
    ${mine.map(f => {
      const home = f.h === G.userClub, opp = G.clubs[home ? f.a : f.h];
      const res = f.pl ? `<b>${f.hg}–${f.ag}</b>` : '<span class="muted">' + fdate(f.t).slice(0, 11) + '</span>';
      const wdl = !f.pl ? '' : (home ? f.hg > f.ag : f.ag > f.hg) ? '<span class="green">W</span>' : f.hg === f.ag ? 'D' : '<span class="red">L</span>';
      return `<tr><td class="muted">${esc(compLabel(f))}</td><td>${home ? 'vs' : '@'} ${logo(opp, 20)} <b>${esc(opp.n)}</b></td><td>${res}</td><td>${wdl}</td></tr>`;
    }).join('')}</table></div>`;
}
function rMarket() {
  const open = ENG.windowOpen(G);
  const posF = window._mpos || 'ALL', lgF = window._mlg ?? -1, q = (window._mq || '').toLowerCase();
  let pool = G.clubs.filter(c => c.id !== G.userClub).flatMap(c => c.players.map(p => ({ p, c })));
  if (posF !== 'ALL') pool = pool.filter(x => x.p.pos === posF);
  if (lgF >= 0) pool = pool.filter(x => x.c.lg === lgF);
  if (q) pool = pool.filter(x => x.p.name.toLowerCase().includes(q));
  pool.sort((a, b) => b.p.ovr - a.p.ovr);
  return `<div class="card"><h3>Transfer Market ${open ? '🟢 open' : '🔴 closed — browse only'}</h3>
    <div class="row">
      <input placeholder="Search player…" value="${esc(window._mq || '')}" oninput="window._mq=this.value;renderHub()" style="width:180px">
      <select onchange="window._mlg=+this.value;renderHub()"><option value="-1">All leagues</option>${DATA.leagues.map((L, i) => `<option value="${i}" ${i === lgF ? 'selected' : ''}>${L.flag} ${esc(L.name)}</option>`).join('')}</select>
      ${['ALL', 'GK', 'DF', 'MF', 'AT'].map(x => `<button style="${posF === x ? 'background:var(--c1);color:var(--c2)' : ''}" onclick="window._mpos='${x}';renderHub()">${x}</button>`).join('')}
    </div>
    <table class="grid"><tr><th></th><th>Pos</th><th>Name</th><th>Age</th><th>OVR</th><th>Fit</th><th>G/A</th><th>Value</th><th>Club</th></tr>
    ${pool.slice(0, 80).map(x => playerRow(x.p, x.c.id, true)).join('')}</table>
    <p class="muted">Showing ${Math.min(80, pool.length)} of ${pool.length}. Click a player to bid.</p></div>`;
}
function rFinance() {
  const c = me();
  return `<div class="card"><h3>Finances</h3>
    <p>Balance: <b class="${c.budget < 0 ? 'red' : 'green'}">${money(c.budget)}</b> · Weekly wage bill: <b>${money(ENG.wageBill(c))}</b></p>
    <p class="muted">Income: monthly broadcast money, matchday gates, prize money, player sales. Outgoings: wages (daily), transfers.</p></div>
    <div class="card"><h3>Transactions</h3><table class="grid">
    ${G.tx.slice(-30).reverse().map(t => `<tr><td class="muted">${fdate(t.t).slice(0, 11)}</td><td>${esc(t.txt)}</td><td class="${t.amt < 0 ? 'red' : 'green'}">${money(t.amt)}</td></tr>`).join('') || '<tr><td class="muted">Nothing yet.</td></tr>'}</table></div>`;
}
function rClub() {
  const c = me();
  return `<div class="card"><h3>Tactics</h3><div class="row">
      Formation <select onchange="me().formation=this.value">${Object.keys(ENG.FORMATIONS).map(f => `<option ${c.formation === f ? 'selected' : ''}>${f}</option>`).join('')}</select>
      Mentality <select onchange="me().mentality=this.value">${['defensive', 'balanced', 'attacking'].map(m => `<option ${c.mentality === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
      <span class="muted">Team morale: ${c.morale}/100</span></div></div>
    <div class="card"><h3>Manager: ${esc(G.managerName)}</h3>
      <p>Reputation: <b>${G.rep}/100</b></p>
      <p>🏆 ${G.trophies.length ? G.trophies.map(esc).join('<br>🏆 ') : '<span class="muted">Trophy cabinet is empty. For now.</span>'}</p></div>
    <div class="card"><h3>News</h3>${G.news.map(n => `<p><span class="muted">${fdate(n.t).slice(5, 11)}</span> ${esc(n.txt)}</p>`).join('') || '<p class="muted">Quiet day.</p>'}</div>`;
}

// ---------- player modal (FUT card) ----------
function findPlayer(id, clubId) { return G.clubs[clubId].players.find(p => p.id === id); }
function openPlayer(id, clubId) {
  const p = findPlayer(id, clubId), own = clubId === G.userClub, c = G.clubs[clubId];
  const open = ENG.windowOpen(G);
  const labels = p.pos === 'GK' ? ['DIV', 'HAN', 'KIC', 'REF', 'SPE', 'POS'] : ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
  let actions;
  if (own) {
    actions = `<div class="row" style="margin-top:12px">
      <button onclick="renew(${id})">📄 Renew (3y, +20% wage)</button>
      <button ${open ? '' : 'disabled'} onclick="askSell(${id})">💰 Sell</button>
      <button onclick="releasePlayer(${id})">🗑 Release</button></div>
      ${open ? '' : '<p class="muted">Selling only during a transfer window.</p>'}`;
  } else {
    actions = `<div class="row" style="margin-top:12px">
      <input id="bid-amt" type="number" step="100000" value="${Math.round(p.value * 1.1)}" style="width:160px">
      <button class="primary" ${open ? '' : 'disabled'} onclick="makeBid(${id},${clubId})">Make bid</button></div>
      <p class="muted" id="bid-msg">${open ? 'Asking price around ' + money(p.value * 1.15) : 'Window closed — come back in summer or January.'}</p>`;
  }
  $('modal').innerHTML = `
    <div class="fut ${tier(p.ovr)}">
      <div class="big"><b>${p.ovr}</b>${p.pos}</div>
      <img class="pface" src="${p.img ? 'https://cdn.sofifa.net/players/' + p.img + '/26_120.png' : FACE0}" onerror="this.onerror=null;this.src=FACE0">
      <div class="pname">${esc(p.name)}</div>
      <div class="stats">${p.a.map((v, i) => `<span><b>${v}</b> ${labels[i]}</span>`).join('')}</div>
    </div>
    <p style="text-align:center;margin-top:10px">${logo(c, 22)} <b>${esc(c.n)}</b> <span class="muted">· ${DATA.leagues[c.lg].flag} ${esc(DATA.leagues[c.lg].name)} · ${esc(p.nat)} · Age ${p.age}${p.youth ? ' · 🌱 academy product' : ''}</span></p>
    <p style="text-align:center" class="muted">Potential ~${p.pot} · Value <b style="color:var(--txt)">${money(p.value)}</b> · ${money(p.wage)}/wk, ${p.years}y left · Fit ${p.fit}% · ${p.sg}G ${p.sa}A in ${p.apps} apps ${p.injury ? `· <span class="inj">injured ${p.injury}d</span>` : ''}</p>
    ${actions}<div class="row" style="margin-top:12px"><button onclick="closeModal()">Close</button></div>`;
  $('modal-bg').classList.add('on');
}
function closeModal() { $('modal-bg').classList.remove('on'); renderHub(); }
function renew(id) {
  const p = findPlayer(id, G.userClub);
  p.years = 3; p.wage = Math.round(p.wage * 1.2 / 100) * 100;
  ENG.news(G, `📄 ${p.name} signed a new 3-year deal.`);
  openPlayer(id, G.userClub);
}
function releasePlayer(id) {
  const p = findPlayer(id, G.userClub);
  if (me().players.length <= 16) return alert('Squad too small to release anyone (min 16).');
  if (!confirm(`Release ${p.name}? You pay 6 months of wages (${money(p.wage * 26)}).`)) return;
  me().players.splice(me().players.indexOf(p), 1);
  me().budget -= p.wage * 26;
  G.tx.push({ t: G.time, txt: 'Released ' + p.name, amt: -p.wage * 26 });
  closeModal();
}
function askSell(id) {
  const p = findPlayer(id, G.userClub);
  if (me().players.length <= 16) return alert('Squad too small to sell (min 16).');
  const { buyer, fee } = ENG.sellPlayer(G, p);
  if (confirm(`${buyer.n} offer ${money(fee)} for ${p.name}. Accept?`)) {
    ENG.completeSale(G, p, buyer, fee);
    closeModal();
  }
}
function makeBid(id, clubId) {
  const p = findPlayer(id, clubId), seller = G.clubs[clubId];
  const offer = Number($('bid-amt').value) || 0;
  if (offer > me().budget) return $('bid-msg').textContent = 'You cannot afford that bid.';
  const r = ENG.bid(G, p, seller, offer);
  if (!r.ok) {
    $('bid-amt').value = r.counter;
    return $('bid-msg').textContent = `Bid rejected. ${seller.s} counter at ${money(r.counter)}.`;
  }
  if (!confirm(`Bid accepted! ${p.name} wants ${money(r.wage)}/wk on a 4-year deal (${money(r.wage * 208)} total wages). Sign him?`)) return;
  ENG.signPlayer(G, p, seller, r.fee, r.wage);
  closeModal();
}

// ---------- continue ----------
function doContinue() {
  for (let i = 0; i < 500; i++) {
    const ev = ENG.advanceDay(G);
    if (ev === 'match') return prepMatch();
    if (ev === 'seasonEnd') return endSeasonUI();
    if (ev === 'offer') {
      const { cid, pid, fee } = G.pendingOffer;
      const buyer = G.clubs[cid], p = me().players.find(p => p.id === pid);
      if (p && confirm(`💰 ${buyer.n} (${DATA.leagues[buyer.lg].flag} ${DATA.leagues[buyer.lg].name}) bid ${money(fee)} for ${p.name} (value ${money(p.value)}). Accept?`)) {
        ENG.acceptOffer(G);
      } else G.pendingOffer = null;
    }
  }
}

// ---------- match day ----------
function pitchHTML(club, xi) {
  const [d, m, a] = ENG.FORMATIONS[club.formation] || [4, 3, 3];
  const lines = [[xi.filter(p => p.pos === 'AT'), 20], [xi.filter(p => p.pos === 'MF'), 46], [xi.filter(p => p.pos === 'DF'), 71], [xi.filter(p => p.pos === 'GK'), 90]];
  let chips = '';
  for (const [ps, y] of lines)
    ps.forEach((p, i) => chips += `<div class="chip" style="left:${(i + 1) / (ps.length + 1) * 100}%;top:${y}%">
      ${face(p, 38)}<div class="nm">${esc(p.name.split(' ').pop())} <b>${p.ovr}</b></div></div>`);
  return `<div class="pitch">${chips}</div>`;
}
function prepMatch() {
  const f = G.fixtures.find(x => x.t === G.time && !x.pl && (x.h === G.userClub || x.a === G.userClub));
  const home = f.h === G.userClub, opp = G.clubs[home ? f.a : f.h];
  const xi = ENG.bestXI(me());
  $('match-pre').style.display = 'block';
  $('match-live').style.display = 'none';
  $('match-post').style.display = 'none';
  $('match-pre').innerHTML = `<div class="card" style="text-align:center">
    <p class="muted disp" style="letter-spacing:2px">MATCH DAY · ${esc(compLabel(f))} · ${fdate(G.time)}</p>
    <div class="row" style="justify-content:center;gap:26px;margin:12px 0">
      <div>${logo(G.clubs[f.h], 72)}<h3>${esc(G.clubs[f.h].n)}</h3></div>
      <h2 style="font-size:40px">VS</h2>
      <div>${logo(G.clubs[f.a], 72)}<h3>${esc(G.clubs[f.a].n)}</h3></div>
    </div>
    <p class="muted">Opponent squad ${Math.round(ENG.power(opp))} OVR · morale ${opp.morale} · you are ${home ? 'HOME' : 'AWAY'}</p>
    <h3 style="margin-top:14px">Your XI — ${me().formation} (${me().mentality})</h3>
    ${pitchHTML(me(), xi)}
    <div class="row" style="justify-content:center;margin-top:12px"><button class="primary" style="font-size:20px;padding:12px 34px" onclick="playMatch()">Kick off ▶</button></div></div>`;
  $('h-date').textContent = fdate(G.time);
  show('match');
}

let matchRes = null, liveMin = 0, shownEv = 0;
function scorebarHTML(f, h, a) {
  return `<span class="tm">${logo(G.clubs[f.h], 34)} ${esc(G.clubs[f.h].s)}</span>
    <span class="sc">${h} – ${a}</span>
    <span class="tm">${esc(G.clubs[f.a].s)} ${logo(G.clubs[f.a], 34)}</span>`;
}
function playMatch() {
  matchRes = ENG.playDay(G);
  autosave();
  const f = matchRes.user.f;
  $('match-pre').style.display = 'none';
  $('match-live').style.display = 'block';
  $('match-comp').textContent = compLabel(f);
  $('ticker').innerHTML = `<div class="muted">${fdate(G.time)} — we're underway!</div>`;
  liveMin = 0; shownEv = 0;
  $('scorebar').innerHTML = scorebarHTML(f, 0, 0);
  tickerTimer = setInterval(() => {
    liveMin++;
    if (liveMin > 90) return finishTicker();
    $('minute').textContent = liveMin + "'";
    const evs = matchRes.user.ev;
    let sb = null;
    while (shownEv < evs.length && evs[shownEv].min <= liveMin) {
      const e = evs[shownEv++];
      $('ticker').innerHTML += `<div class="${e.goal ? 'goal' : ''}">${esc(e.txt)}</div>`;
      $('ticker').scrollTop = 1e6;
      if (e.goal) sb = e.score;
    }
    if (sb) { const [h, a] = sb.split('-').map(Number); $('scorebar').innerHTML = scorebarHTML(f, h, a); }
  }, 70);
}
function skipTicker() { finishTicker(); }
function finishTicker() {
  clearInterval(tickerTimer);
  const u = matchRes.user, f = u.f, st = u.stats;
  $('match-live').style.display = 'none';
  $('match-post').style.display = 'block';
  const won = (f.h === G.userClub && f.hg > f.ag) || (f.a === G.userClub && f.ag > f.hg);
  const drew = f.hg === f.ag;
  G.rep = Math.max(0, Math.min(100, G.rep + (won ? 1 : drew ? 0 : -1)));
  const myRatings = u.ratings.filter(r => r.club === G.userClub).sort((a, b) => b.r - a.r);
  const motm = u.ratings.slice().sort((a, b) => b.r - a.r)[0];
  const sameComp = matchRes.others.filter(o => o.c === f.c);
  const bar = (l, hv, av, lbl) => `<div class="statbar"><span>${hv}</span>
    <div class="bar" style="justify-content:flex-end"><i style="width:${l(hv, av)}%;background:${G.clubs[f.h].c1}"></i></div>
    <span class="lbl">${lbl}</span>
    <div class="bar"><i style="width:${l(av, hv)}%;background:${G.clubs[f.a].c1}"></i></div><span style="text-align:right">${av}</span></div>`;
  const pct = (x, y) => Math.round(100 * x / Math.max(1, x + y));
  $('match-post').innerHTML = `<div class="card" style="text-align:center">
    <p class="muted disp" style="letter-spacing:2px">FULL TIME · ${esc(compLabel(f))}</p>
    <div class="scorebar" style="margin:10px 0">${scorebarHTML(f, f.hg, f.ag)}</div>
    <p class="muted">${[...u.scorers.h, ...u.scorers.a].map(esc).join(' · ') || 'No goals.'} ${won ? '🎉' : drew ? '' : '😞'}</p>
    <div style="max-width:560px;margin:14px auto">
      ${bar(pct, st.h.poss, st.a.poss, 'Possession %')}
      ${bar(pct, st.h.shots, st.a.shots, 'Shots')}
      ${bar(pct, st.h.sot, st.a.sot, 'On target')}
    </div>
    <h3>⭐ Man of the Match</h3>
    <div class="row" style="justify-content:center">${face(motm, 54)}<div style="text-align:left"><b>${esc(motm.name)}</b><br>${ovrChip(motm.ovr)} <b style="color:var(--acc)">${motm.r.toFixed(1)}</b></div></div>
    <h3 style="margin-top:14px">Your player ratings</h3>
    <table class="grid" style="max-width:480px;margin:0 auto">${myRatings.map(r => `<tr><td>${face(r, 26)}</td><td class="pos-${r.pos}">${r.pos}</td><td style="text-align:left"><b>${esc(r.name)}</b></td><td><b style="color:${r.r >= 7.5 ? 'var(--acc)' : r.r < 6 ? '#ff6b6b' : 'inherit'}">${r.r.toFixed(1)}</b></td></tr>`).join('')}</table>
    ${sameComp.length ? `<h3 style="margin-top:14px">Elsewhere</h3><table class="grid" style="max-width:480px;margin:0 auto">${sameComp.slice(0, 12).map(o => `<tr><td style="text-align:right">${esc(G.clubs[o.h].s)} ${logo(G.clubs[o.h], 20)}</td><td style="text-align:center"><b>${o.hg}–${o.ag}</b></td><td>${logo(G.clubs[o.a], 20)} ${esc(G.clubs[o.a].s)}</td></tr>`).join('')}</table>` : ''}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="primary" onclick="tab='table';enterHub()">Continue ▶</button></div></div>`;
}

// ---------- season end ----------
function endSeasonUI() {
  const s = ENG.endSeason(G);
  autosave();
  enterHub();
  $('modal').innerHTML = `<h2>🏆 Season ${G.season - 1} Complete</h2>
    <p>You finished <b>${s.userPos}${['st', 'nd', 'rd'][s.userPos - 1] || 'th'}</b> and earned ${money(s.prize)}.</p>
    <div class="card"><b>CHAMPIONS</b><br>${s.champions.map(esc).join('<br>')}</div>
    <div class="card"><b>UP & DOWN</b><br>${s.proms.map(esc).join('<br>')}</div>
    <div class="card"><b>${esc(myLeague().name).toUpperCase()} AWARDS</b><br>
    ⚽ Golden Boot: <b>${esc(s.awards.topScorer.name)}</b> (${esc(s.awards.topScorer.club)}) — ${s.awards.topScorer.goals} goals<br>
    🌟 Player of the Season: <b>${esc(s.awards.bestPlayer.name)}</b> (${esc(s.awards.bestPlayer.club)})<br>
    🌱 Best Young Player: <b>${esc(s.awards.bestYoung.name)}</b> (${esc(s.awards.bestYoung.club)}, ${s.awards.bestYoung.age})</div>
    <p class="muted">Players aged, contracts ticked down, youth prospects arrived. Season ${G.season} starts in July.</p>
    <div class="row"><button class="primary" onclick="closeModal()">On to Season ${G.season} ▶</button></div>`;
  $('modal-bg').classList.add('on');
}

$('src').textContent = 'Data: ' + DATA.source;
renderSlots();
</script>
