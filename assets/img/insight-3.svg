<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Illustration: a signed document with a seal representing mergers and exits">
  <defs>
    <linearGradient id="i3bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17130b"/><stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="i3g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7c878"/><stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <radialGradient id="i3glow" cx="50%" cy="14%" r="70%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.22"/><stop offset="100%" stop-color="#c9a24a" stop-opacity="0"/>
    </radialGradient>
    <filter id="i3grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.47 0 0 0 0 0.28 0 0 0 0.5 0"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#i3bg)"/>
  <rect width="640" height="400" fill="url(#i3glow)"/>
  <!-- document -->
  <g fill="none" stroke="url(#i3g)" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round">
    <path d="M232 70 L372 70 L420 118 L420 330 L232 330 Z" stroke-linejoin="round"/>
    <path d="M372 70 L372 118 L420 118"/>
    <g stroke-opacity="0.4" stroke-width="1.6">
      <line x1="258" y1="150" x2="394" y2="150"/><line x1="258" y1="176" x2="394" y2="176"/>
      <line x1="258" y1="202" x2="394" y2="202"/><line x1="258" y1="228" x2="340" y2="228"/>
    </g>
    <!-- signature line -->
    <line x1="258" y1="288" x2="360" y2="288" stroke-opacity="0.55"/>
    <path d="M262 284 c10 -14 16 8 26 -2 c8 -8 14 6 22 -4" stroke-opacity="0.9" stroke-width="2"/>
  </g>
  <!-- wax seal -->
  <g transform="translate(392 300)">
    <circle r="34" fill="#9a7526" fill-opacity="0.25" stroke="url(#i3g)" stroke-width="2.2"/>
    <circle r="22" fill="none" stroke="url(#i3g)" stroke-width="1.4" stroke-opacity="0.6"/>
    <path d="M0 -14 L4 -4 L15 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-15 -4 L-4 -4 Z" fill="url(#i3g)" fill-opacity="0.85"/>
  </g>
  <rect width="640" height="400" filter="url(#i3grain)" opacity="0.05"/>
  <rect x="1" y="1" width="638" height="398" fill="none" stroke="#c9a24a" stroke-opacity="0.12"/>
</svg>
