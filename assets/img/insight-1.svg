<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Illustration: classical columns representing business formation">
  <defs>
    <linearGradient id="i1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17130b"/><stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="i1g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7c878"/><stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <radialGradient id="i1glow" cx="50%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#c9a24a" stop-opacity="0.22"/><stop offset="100%" stop-color="#c9a24a" stop-opacity="0"/>
    </radialGradient>
    <filter id="i1grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.47 0 0 0 0 0.28 0 0 0 0.5 0"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#i1bg)"/>
  <rect width="640" height="400" fill="url(#i1glow)"/>
  <g stroke="url(#i1g)" stroke-opacity="0.85" fill="none" stroke-width="2.4">
    <!-- pediment -->
    <path d="M150 120 L320 66 L490 120" stroke-linejoin="round"/>
    <line x1="150" y1="120" x2="490" y2="120"/>
    <line x1="140" y1="140" x2="500" y2="140"/>
    <!-- columns -->
    <g stroke-width="2.2">
      <rect x="188" y="152" width="30" height="176"/>
      <rect x="268" y="152" width="30" height="176"/>
      <rect x="348" y="152" width="30" height="176"/>
      <rect x="428" y="152" width="30" height="176"/>
    </g>
    <!-- fluting hint -->
    <g stroke-opacity="0.35" stroke-width="1">
      <line x1="203" y1="156" x2="203" y2="324"/><line x1="283" y1="156" x2="283" y2="324"/>
      <line x1="363" y1="156" x2="363" y2="324"/><line x1="443" y1="156" x2="443" y2="324"/>
    </g>
    <!-- base -->
    <line x1="150" y1="340" x2="490" y2="340"/>
    <line x1="132" y1="356" x2="508" y2="356"/>
  </g>
  <rect width="640" height="400" filter="url(#i1grain)" opacity="0.05"/>
  <rect x="1" y="1" width="638" height="398" fill="none" stroke="#c9a24a" stroke-opacity="0.12"/>
</svg>
